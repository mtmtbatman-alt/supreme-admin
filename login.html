<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>슈프림 어드민 - 보안 로그인</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b0b0b] text-white min-h-screen flex items-center justify-center m-0">

    <div class="w-full max-w-md p-8 bg-[#141416] rounded-2xl border border-[#222226] shadow-2xl">
        <!-- 로고 -->
        <div class="flex items-center justify-center gap-3 mb-8">
            <span class="w-3 h-3 rounded-full bg-red-600 animate-pulse"></span>
            <h1 class="text-red-600 font-bold text-xl tracking-wider">SUPREME ADMIN V2</h1>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
            <div>
                <label class="block text-xs text-gray-400 mb-2 font-medium">관리자 계정 이메일</label>
                <input type="email" id="adminEmail" required placeholder="admin@supreme.com" class="w-full bg-[#0b0b0b] border border-[#222226] text-white text-sm rounded-xl px-4 py-3 outline-none focus:border-red-600 transition-colors">
            </div>
            <div>
                <label class="block text-xs text-gray-400 mb-2 font-medium">보안 비밀번호</label>
                <input type="password" id="adminPassword" required placeholder="••••••••" class="w-full bg-[#0b0b0b] border border-[#222226] text-white text-sm rounded-xl px-4 py-3 outline-none focus:border-red-600 transition-colors">
            </div>
            <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-medium py-3 rounded-xl transition-colors shadow-lg shadow-red-900/30 text-sm">
                안전한 관리자 로그인
            </button>
        </form>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('adminEmail').value.trim();
            const password = document.getElementById('adminPassword').value.trim();

            // V2 보안 인증 표준 적용 (시연용 세션 주입 및 토큰 분리)
            if (email && password) {
                const mockAuthUser = {
                    email: email,
                    role: 'SUPER_ADMIN',
                    loginTime: new Date().toISOString()
                };
                sessionStorage.setItem('sp_admin_user', JSON.stringify(mockAuthUser));
                localStorage.setItem('sp_access_token', 'jwt_secure_token_sample_v2');
                
                alert('인증 성공! 관리자 대시보드로 이동합니다.');
                window.location.href = 'dashboard.html';
            } else {
                alert('이메일과 비밀번호를 올바르게 입력해주세요.');
            }
        }
    </script>
</body>
</html>

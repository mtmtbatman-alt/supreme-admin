<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>슈프림 어드민 - 공지사항 관리 센터</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#0b0b0b] text-white min-h-screen flex m-0">

    <!-- 사이드바 (원본 100% 유지) -->
    <aside class="w-64 bg-[#141416] border-r border-[#222226] p-6 flex flex-col justify-between">
        <div>
            <div class="flex items-center gap-3 mb-10">
                <span class="w-2.5 h-2.5 rounded-full bg-red-600"></span>
                <h1 class="text-red-600 font-bold text-lg tracking-wider">SUPREME ADMIN</h1>
            </div>
            <nav class="space-y-2 text-sm text-gray-400">
                <a href="dashboard.html" class="flex items-center px-4 py-3 rounded-xl hover:text-white hover:bg-[#1e1e24] transition-colors">
                    대시보드 홈
                </a>
                <a href="content.html" class="flex items-center px-4 py-3 rounded-xl hover:text-white hover:bg-[#1e1e24] transition-colors">
                    콘텐츠 관리
                </a>
                <a href="banners.html" class="flex items-center px-4 py-3 rounded-xl hover:text-white hover:bg-[#1e1e24] transition-colors">
                    배너 관리
                </a>
                <a href="notice.html" class="flex items-center px-4 py-3 rounded-xl text-white bg-gradient-to-r from-red-600 to-red-700 shadow-lg shadow-red-900/30 font-medium">
                    공지사항
                </a>
                <a href="settings.html" class="flex items-center px-4 py-3 rounded-xl hover:text-white hover:bg-[#1e1e24] transition-colors">
                    설정
                </a>
                <a href="backup.html" class="flex items-center px-4 py-3 rounded-xl hover:text-white hover:bg-[#1e1e24] transition-colors">
                    시스템 백업
                </a>
            </nav>
        </div>
        <div class="pt-4 border-t border-[#222226]">
            <button id="logoutBtn" class="w-full text-left px-4 py-3 rounded-xl text-sm text-gray-400 hover:text-red-500 hover:bg-red-500/10 transition-colors">
                로그아웃
            </button>
        </div>
    </aside>

    <!-- 메인 컨텐츠 영역 -->
    <main class="flex-1 p-10 overflow-y-auto">
        <!-- 상단 헤더 및 작성 버튼 -->
        <header class="mb-8 flex justify-between items-center">
            <div>
                <div class="flex items-center gap-3">
                    <h2 class="text-2xl font-bold">공지사항 관리 센터</h2>
                    <span class="bg-red-500/10 text-red-500 text-xs px-2.5 py-1 rounded-full font-semibold border border-red-500/20" id="totalNoticeBadge">전체 0개</span>
                </div>
                <p class="text-xs text-gray-500 mt-1">서비스 안내, 서버 점검, 예약 게시글 및 메인 팝업 연동 공지를 한눈에 통합 관리합니다.</p>
            </div>
            <button onclick="openNoticeModal()" class="bg-red-600 hover:bg-red-700 text-white px-5 py-2.5 rounded-xl text-sm font-medium transition-colors shadow-lg shadow-red-900/30 flex items-center gap-2">
                <i data-lucide="plus" class="w-4 h-4"></i> 공지사항 작성
            </button>
        </header>

        <!-- 상단 요약 통계 카드 섹션 -->
        <section class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-[#141416] p-5 rounded-xl border border-[#222226] flex items-center justify-between">
                <div>
                    <p class="text-xs text-gray-400 mb-1">전체 게시글</p>
                    <h3 class="text-xl font-bold text-white" id="statTotal">0개</h3>
                </div>
                <div class="w-10 h-10 rounded-lg bg-gray-800/50 flex items-center justify-center text-gray-400">
                    <i data-lucide="file-text" class="w-5 h-5"></i>
                </div>
            </div>
            <div class="bg-[#141416] p-5 rounded-xl border border-[#222226] flex items-center justify-between">
                <div>
                    <p class="text-xs text-gray-400 mb-1">상단 고정 공지</p>
                    <h3 class="text-xl font-bold text-red-500" id="statPinned">0개</h3>
                </div>
                <div class="w-10 h-10 rounded-lg bg-red-500/10 flex items-center justify-center text-red-500">
                    <i data-lucide="pin" class="w-5 h-5"></i>
                </div>
            </div>
            <div class="bg-[#141416] p-5 rounded-xl border border-[#222226] flex items-center justify-between">
                <div>
                    <p class="text-xs text-gray-400 mb-1">예약 대기 중</p>
                    <h3 class="text-xl font-bold text-amber-500" id="statReserved">0개</h3>
                </div>
                <div class="w-10 h-10 rounded-lg bg-amber-500/10 flex items-center justify-center text-amber-500">
                    <i data-lucide="clock" class="w-5 h-5"></i>
                </div>
            </div>
            <div class="bg-[#141416] p-5 rounded-xl border border-[#222226] flex items-center justify-between">
                <div>
                    <p class="text-xs text-gray-400 mb-1">누적 총 조회수</p>
                    <h3 class="text-xl font-bold text-green-500" id="statViews">0회</h3>
                </div>
                <div class="w-10 h-10 rounded-lg bg-green-500/10 flex items-center justify-center text-green-500">
                    <i data-lucide="eye" class="w-5 h-5"></i>
                </div>
            </div>
        </section>

        <!-- 검색 및 필터 바 -->
        <section class="bg-[#141416] p-4 rounded-xl border border-[#222226] mb-6 flex flex-wrap gap-4 items-center justify-between">
            <div class="flex items-center gap-3">
                <select class="bg-[#0b0b0b] border border-[#222226] text-gray-300 text-xs rounded-lg px-3 py-2.5 outline-none focus:border-red-600">
                    <option>전체 카테고리</option>
                    <option>공지</option>
                    <option>점검</option>
                    <option>이벤트</option>
                </select>
                <select class="bg-[#0b0b0b] border border-[#222226] text-gray-300 text-xs rounded-lg px-3 py-2.5 outline-none focus:border-red-600">
                    <option>모든 게시글</option>
                    <option>상단 고정만</option>
                    <option>예약 게시글</option>
                </select>
            </div>
            <div class="w-72">
                <input type="text" placeholder="공지 제목 검색..." class="w-full bg-[#0b0b0b] border border-[#222226] text-gray-300 text-xs rounded-lg px-4 py-2.5 outline-none focus:border-red-600">
            </div>
        </section>

        <!-- 공지사항 목록 테이블 (XSS 방어 textContent 적용 구조) -->
        <section class="bg-[#141416] rounded-xl border border-[#222226] overflow-hidden">
            <table class="w-full text-left border-collapse text-sm">
                <thead>
                    <tr class="border-b border-[#222226] text-gray-400 bg-[#1a1a1e] text-xs">
                        <th class="p-4 w-16 text-center">고정</th>
                        <th class="p-4 w-28">분류</th>
                        <th class="p-4">공지 제목</th>
                        <th class="p-4 w-32">타겟 대상</th>
                        <th class="p-4 w-24 text-center">조회수</th>
                        <th class="p-4 w-40">게시 일시</th>
                        <th class="p-4 w-28 text-center">관리</th>
                    </tr>
                </thead>
                <tbody id="noticeTableBody" class="divide-y divide-[#222226] text-gray-300 text-xs">
                    <!-- 데이터 렌더링 영역 -->
                </tbody>
            </table>
        </section>
    </main>

    <!-- 스크립트 영역 -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const adminUser = JSON.parse(sessionStorage.getItem('sp_admin_user'));
            if (!adminUser) {
                window.location.href = 'login.html';
                return;
            }
            document.getElementById('logoutBtn').addEventListener('click', () => {
                sessionStorage.removeItem('sp_admin_user');
                window.location.href = 'login.html';
            });

            if (window.lucide) {
                window.lucide.createIcons();
            }

            loadNotices();
        });

        // XSS 방어 및 안전한 출력 테스트 샘플 데이터 로드
        function loadNotices() {
            const tbody = document.getElementById('noticeTableBody');
            tbody.innerHTML = '';

            const sampleData = [
                { id: 1, pinned: true, category: '점검', title: '슈프림 어드민 V2 시스템 정기 점검 안내', target: '전체 회원', views: 1420, date: '2026-08-15 02:00' },
                { id: 2, pinned: false, category: '공지', title: '플랫폼 이용약관 개정 안내 (신규 기능 추가)', target: '전체 회원', views: 890, date: '2026-08-10 12:00' }
            ];

            document.getElementById('statTotal').textContent = sampleData.length + '개';
            document.getElementById('statPinned').textContent = sampleData.filter(n => n.pinned).length + '개';
            document.getElementById('totalNoticeBadge').textContent = `전체 ${sampleData.length}개`;

            sampleData.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-[#1a1a1e] transition-colors';

                // 고정 여부
                const tdPin = document.createElement('td');
                tdPin.className = 'p-4 text-center';
                tdPin.innerHTML = item.pinned ? '<span class="text-red-500 font-bold">📌</span>' : '<span class="text-gray-600">-</span>';
                tr.appendChild(tdPin);

                // 분류
                const tdCat = document.createElement('td');
                tdCat.className = 'p-4';
                tdCat.innerHTML = `<span class="bg-red-500/10 text-red-500 px-2 py-0.5 rounded font-semibold">${item.category}</span>`;
                tr.appendChild(tdCat);

                // 제목 (XSS 방어: textContent 활용)
                const tdTitle = document.createElement('td');
                tdTitle.className = 'p-4 font-medium text-white';
                tdTitle.textContent = item.title; 
                tr.appendChild(tdTitle);

                // 타겟
                const tdTarget = document.createElement('td');
                tdTarget.className = 'p-4 text-gray-400';
                tdTarget.textContent = item.target;
                tr.appendChild(tdTarget);

                // 조회수
                const tdViews = document.createElement('td');
                tdViews.className = 'p-4 text-center text-gray-400';
                tdViews.textContent = item.views.toLocaleString() + '회';
                tr.appendChild(tdViews);

                // 일시
                const tdDate = document.createElement('td');
                tdDate.className = 'p-4 text-gray-500';
                tdDate.textContent = item.date;
                tr.appendChild(tdDate);

                // 관리 버튼
                const tdAction = document.createElement('td');
                tdAction.className = 'p-4 text-center';
                tdAction.innerHTML = `
                    <button class="text-gray-400 hover:text-white mr-2">수정</button>
                    <button class="text-red-500 hover:text-red-400">삭제</button>
                `;
                tr.appendChild(tdAction);

                tbody.appendChild(tr);
            });
        }

        function openNoticeModal() {
            alert('공지사항 작성/등록 모달 창을 띄웁니다.');
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공지사항 관리 - SUPREME ADMIN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-zinc-950 text-white min-h-screen flex selection:bg-red-600 selection:text-white">

  <!-- 사이드바 -->
  <aside class="w-64 bg-zinc-900 border-r border-zinc-800 flex flex-col justify-between min-h-screen p-4 shrink-0">
    <div>
      <div class="px-4 py-3 mb-6 flex items-center gap-2">
        <div class="w-3 h-3 rounded-full bg-red-600 animate-pulse"></div>
        <h1 class="text-xl font-black text-red-600 tracking-wider">SUPREME ADMIN</h1>
      </div>
      <nav class="space-y-1">
        <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 text-sm font-semibold text-zinc-400 hover:text-white hover:bg-zinc-800/80 rounded-xl transition">
          <i data-lucide="layout-dashboard" class="w-4 h-4"></i> 대시보드 홈
        </a>
        <a href="content.html" class="flex items-center gap-3 px-4 py-3 text-sm font-semibold text-zinc-400 hover:text-white hover:bg-zinc-800/80 rounded-xl transition">
          <i data-lucide="film" class="w-4 h-4"></i> 콘텐츠 관리
        </a>
        <a href="banners.html" class="flex items-center gap-3 px-4 py-3 text-sm font-semibold text-zinc-400 hover:text-white hover:bg-zinc-800/80 rounded-xl transition">
          <i data-lucide="image" class="w-4 h-4"></i> 배너 관리
        </a>
        <a href="notice.html" class="flex items-center gap-3 px-4 py-3 text-sm font-semibold text-white bg-red-600 rounded-xl shadow-lg shadow-red-600/20 transition">
          <i data-lucide="bell" class="w-4 h-4"></i> 공지사항
        </a>
        <a href="settings.html" class="flex items-center gap-3 px-4 py-3 text-sm font-semibold text-zinc-400 hover:text-white hover:bg-zinc-800/80 rounded-xl transition">
          <i data-lucide="settings" class="w-4 h-4"></i> 설정
        </a>
        <a href="backup.html" class="flex items-center gap-3 px-4 py-3 text-sm font-semibold text-zinc-400 hover:text-white hover:bg-zinc-800/80 rounded-xl transition">
          <i data-lucide="database" class="w-4 h-4"></i> 시스템 백업
        </a>
      </nav>
    </div>
    
    <div class="pt-4 border-t border-zinc-800">
      <button onclick="location.href='login.html'" class="w-full flex items-center gap-3 px-4 py-3 text-sm font-semibold text-zinc-400 hover:text-red-500 hover:bg-zinc-800/80 rounded-xl transition">
        <i data-lucide="log-out" class="w-4 h-4"></i> 로그아웃
      </button>
    </div>
  </aside>

  <!-- 메인 영역 -->
  <main class="flex-1 p-8 overflow-y-auto max-w-[1600px] mx-auto w-full">
    <!-- 헤더 -->
    <header class="flex flex-col md:flex-row justify-between md:items-center gap-4 mb-8">
      <div>
        <div class="flex items-center gap-3">
          <h2 class="text-2xl font-black text-white tracking-tight">공지사항 관리</h2>
          <span id="noticeBadge" class="bg-red-500/10 border border-red-500/30 text-xs text-red-400 px-3 py-1 rounded-full font-bold">전체 0개</span>
        </div>
        <p class="text-xs text-zinc-400 mt-1">서비스 안내, 서버 점검, 이벤트 등 이용자에게 전달할 공지글을 등록 및 관리합니다.</p>
      </div>
      
      <button id="openNoticeModalBtn" class="bg-red-600 hover:bg-red-700 text-white font-bold text-xs px-5 py-3 rounded-xl shadow-lg shadow-red-600/30 transition flex items-center justify-center gap-2 shrink-0">
        <i data-lucide="plus" class="w-4 h-4"></i> 공지사항 작성
      </button>
    </header>

    <!-- 필터 및 검색 바 -->
    <div class="flex flex-col sm:flex-row justify-between items-stretch sm:items-center gap-4 mb-6 bg-zinc-900/60 p-3 rounded-2xl border border-zinc-800/80 backdrop-blur-md">
      <div class="flex gap-2 overflow-x-auto pb-2 sm:pb-0">
        <select id="categoryFilter" class="bg-zinc-800 border border-zinc-700 text-xs text-zinc-300 rounded-xl px-3 py-2 outline-none focus:border-red-500">
          <option value="all">전체 카테고리</option>
          <option value="system">시스템 안내</option>
          <option value="event">이벤트</option>
          <option value="maintenance">점검 공지</option>
          <option value="update">업데이트</option>
        </select>

        <select id="pinnedFilter" class="bg-zinc-800 border border-zinc-700 text-xs text-zinc-300 rounded-xl px-3 py-2 outline-none focus:border-red-500">
          <option value="all">모든 게시글</option>
          <option value="pinned">중요 고정글만</option>
        </select>
      </div>

      <div class="relative w-full sm:w-72">
        <i data-lucide="search" class="w-4 h-4 text-zinc-500 absolute left-3 top-1/2 -translate-y-1/2"></i>
        <input type="text" id="searchInput" placeholder="공지 제목 검색..." class="w-full bg-zinc-800/90 border border-zinc-700 text-xs text-white rounded-xl pl-9 pr-3 py-2 outline-none focus:border-red-500 transition">
      </div>
    </div>

    <!-- 공지사항 리스트 테이블 -->
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden shadow-xl">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs text-zinc-300">
          <thead class="bg-zinc-950/80 border-b border-zinc-800 text-zinc-400 font-bold uppercase tracking-wider">
            <tr>
              <th class="py-4 px-5 text-center w-16">고정</th>
              <th class="py-4 px-5 w-28">분류</th>
              <th class="py-4 px-5">제목</th>
              <th class="py-4 px-5 text-center w-28">조회수</th>
              <th class="py-4 px-5 text-center w-32">등록일</th>
              <th class="py-4 px-5 text-center w-28">관리</th>
            </tr>
          </thead>
          <tbody id="noticeTableBody" class="divide-y divide-zinc-800/60">
            <!-- JS로 로드됩니다 -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- 공지사항 등록/수정 모달 -->
  <div id="noticeModal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4 z-50">
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl w-full max-w-2xl p-6 relative shadow-2xl my-8 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center pb-4 mb-4 border-b border-zinc-800 sticky top-0 bg-zinc-900 z-10">
        <h3 id="modalTitle" class="text-lg font-bold text-white flex items-center gap-2">
          <i data-lucide="bell" class="w-5 h-5 text-red-500"></i> 새 공지사항 등록
        </h3>
        <button id="closeNoticeModalBtn" class="text-zinc-500 hover:text-white p-1 transition"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>

      <form id="noticeForm" class="space-y-4">
        <input type="hidden" id="noticeId">

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-zinc-400 mb-1 font-medium">카테고리 <span class="text-red-500">*</span></label>
            <select id="noticeCategoryInput" required class="w-full bg-zinc-800 border border-zinc-700 text-xs text-white rounded-xl p-3 outline-none focus:border-red-500">
              <option value="system">시스템 안내</option>
              <option value="event">이벤트</option>
              <option value="maintenance">점검 공지</option>
              <option value="update">업데이트</option>
            </select>
          </div>
          <div class="flex items-end pb-3">
            <label class="flex items-center gap-2 cursor-pointer text-xs font-semibold text-zinc-300">
              <input type="checkbox" id="noticePinnedInput" class="w-4 h-4 rounded accent-red-600 bg-zinc-800 border-zinc-700">
              <span class="text-red-400 font-bold">상단 중요 공지 고정</span>
            </label>
          </div>
        </div>

        <div>
          <label class="block text-xs text-zinc-400 mb-1 font-medium">공지 제목 <span class="text-red-500">*</span></label>
          <input type="text" id="noticeTitleInput" required placeholder="예: [안내] 2026년 8월 서비스 정기 점검 안내" class="w-full bg-zinc-800 border border-zinc-700 text-xs text-white rounded-xl p-3 outline-none focus:border-red-500 transition">
        </div>

        <div>
          <label class="block text-xs text-zinc-400 mb-1 font-medium">공지 내용 <span class="text-red-500">*</span></label>
          <textarea id="noticeContentInput" rows="8" required placeholder="공지사항 상세 내용을 입력하세요." class="w-full bg-zinc-800 border border-zinc-700 text-xs text-white rounded-xl p-3 outline-none focus:border-red-500 transition resize-none"></textarea>
        </div>

        <div class="flex justify-end gap-2 pt-4 border-t border-zinc-800">
          <button type="button" id="cancelNoticeModalBtn" class="px-5 py-2.5 text-xs text-zinc-400 hover:bg-zinc-800 rounded-xl transition">취소</button>
          <button type="submit" class="px-6 py-2.5 text-xs bg-red-600 hover:bg-red-700 font-bold rounded-xl text-white shadow-lg shadow-red-600/30 transition">게시하기</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="js/notice.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>슈프림 어드민 - 배너 관리</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b0b0b] text-white min-h-screen flex m-0">

    <!-- 사이드바 (기존 원본 구조 100% 유지) -->
    <aside class="w-64 bg-[#141416] border-r border-[#222226] p-6 flex flex-col justify-between">
        <div>
            <div class="flex items-center gap-3 mb-10">
                <span class="w-2.5 h-2.5 rounded-full bg-red-600"></span>
                <h1 class="text-red-600 font-bold text-lg tracking-wider">SUPREME ADMIN</h1>
            </div>
            <nav class="space-y-2 text-sm text-gray-400">
                <a href="dashboard.html" class="flex items-center px-4 py-3 rounded-xl hover:text-white hover:bg-[#1e1e24] transition-colors">
                    대시보드 홈
                </a>
                <a href="content.html" class="flex items-center px-4 py-3 rounded-xl hover:text-white hover:bg-[#1e1e24] transition-colors">
                    콘텐츠 관리
                </a>
                <a href="banners.html" class="flex items-center px-4 py-3 rounded-xl text-white bg-gradient-to-r from-red-600 to-red-700 shadow-lg shadow-red-900/30 font-medium">
                    배너 관리
                </a>
                <a href="notice.html" class="flex items-center px-4 py-3 rounded-xl hover:text-white hover:bg-[#1e1e24] transition-colors">
                    공지사항
                </a>
                <a href="settings.html" class="flex items-center px-4 py-3 rounded-xl hover:text-white hover:bg-[#1e1e24] transition-colors">
                    설정
                </a>
                <a href="backup.html" class="flex items-center px-4 py-3 rounded-xl hover:text-white hover:bg-[#1e1e24] transition-colors">
                    시스템 백업
                </a>
            </nav>
        </div>
        <div class="pt-4 border-t border-[#222226]">
            <button id="logoutBtn" class="w-full text-left px-4 py-3 rounded-xl text-sm text-gray-400 hover:text-red-500 hover:bg-red-500/10 transition-colors">
                로그아웃
            </button>
        </div>
    </aside>

    <!-- 메인 컨텐츠 영역 -->
    <main class="flex-1 p-10 overflow-y-auto">
        <header class="mb-8 flex justify-between items-center">
            <div>
                <h2 class="text-2xl font-bold">배너 관리 시스템</h2>
                <p class="text-xs text-gray-500 mt-1">메인, 모바일, 팝업 배너를 통합 관리합니다.</p>
            </div>
            <button onclick="openBannerModal()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-xl text-sm font-medium transition-colors">
                + 신규 배너 등록
            </button>
        </header>

        <!-- 배너 목록 테이블 섹션 -->
        <section class="bg-[#141416] rounded-xl border border-[#222226] overflow-hidden">
            <table class="w-full text-left border-collapse text-sm">
                <thead>
                    <tr class="border-b border-[#222226] text-gray-400 bg-[#1a1a1e]">
                        <th class="p-4">구분</th>
                        <th class="p-4">배너 제목</th>
                        <th class="p-4">클릭 URL</th>
                        <th class="p-4">노출 기간</th>
                        <th class="p-4">상태</th>
                        <th class="p-4 text-center">관리</th>
                    </tr>
                </thead>
                <tbody id="bannerTableBody" class="divide-y divide-[#222226] text-gray-300">
                    <tr>
                        <td class="p-4"><span class="bg-red-500/10 text-red-500 px-2.5 py-1 rounded-md text-xs font-semibold">메인 배너</span></td>
                        <td class="p-4 font-medium text-white">시즌 2 독점 공개 기념 메인 배너</td>
                        <td class="p-4 text-gray-500 text-xs">/watch/season2</td>
                        <td class="p-4 text-xs text-gray-400">2026-08-01 ~ 2026-08-31</td>
                        <td class="p-4"><span class="text-green-500 text-xs font-medium">● 노출중</span></td>
                        <td class="p-4 text-center">
                            <button class="text-gray-400 hover:text-white text-xs mr-2">수정</button>
                            <button class="text-red-500 hover:text-red-400 text-xs">삭제</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <script>
        // 인증 체크 및 로그아웃 연동
        document.addEventListener('DOMContentLoaded', () => {
            const adminUser = JSON.parse(sessionStorage.getItem('sp_admin_user'));
            if (!adminUser) {
                window.location.href = 'login.html';
            }
            document.getElementById('logoutBtn').addEventListener('click', () => {
                sessionStorage.removeItem('sp_admin_user');
                window.location.href = 'login.html';
            });
        });

        function openBannerModal() {
            alert('신규 배너 등록 모달 창을 띄울 예정입니다.');
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>배너 관리 - SUPREME ADMIN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-zinc-950 text-white min-h-screen flex selection:bg-red-600 selection:text-white">

  <!-- 사이드바 -->
  <aside class="w-64 bg-zinc-900 border-r border-zinc-800 flex flex-col justify-between min-h-screen p-4 shrink-0">
    <div>
      <div class="px-4 py-3 mb-6 flex items-center gap-2">
        <div class="w-3 h-3 rounded-full bg-red-600 animate-pulse"></div>
        <h1 class="text-xl font-black text-red-600 tracking-wider">SUPREME ADMIN</h1>
      </div>
      <nav class="space-y-1">
        <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 text-sm font-semibold text-zinc-400 hover:text-white hover:bg-zinc-800/80 rounded-xl transition">
          <i data-lucide="layout-dashboard" class="w-4 h-4"></i> 대시보드 홈
        </a>
        <a href="content.html" class="flex items-center gap-3 px-4 py-3 text-sm font-semibold text-zinc-400 hover:text-white hover:bg-zinc-800/80 rounded-xl transition">
          <i data-lucide="film" class="w-4 h-4"></i> 콘텐츠 관리
        </a>
        <a href="banners.html" class="flex items-center gap-3 px-4 py-3 text-sm font-semibold text-white bg-red-600 rounded-xl shadow-lg shadow-red-600/20 transition">
          <i data-lucide="image" class="w-4 h-4"></i> 배너 관리
        </a>
        <a href="notice.html" class="flex items-center gap-3 px-4 py-3 text-sm font-semibold text-zinc-400 hover:text-white hover:bg-zinc-800/80 rounded-xl transition">
          <i data-lucide="bell" class="w-4 h-4"></i> 공지사항
        </a>
        <a href="settings.html" class="flex items-center gap-3 px-4 py-3 text-sm font-semibold text-zinc-400 hover:text-white hover:bg-zinc-800/80 rounded-xl transition">
          <i data-lucide="settings" class="w-4 h-4"></i> 설정
        </a>
        <a href="backup.html" class="flex items-center gap-3 px-4 py-3 text-sm font-semibold text-zinc-400 hover:text-white hover:bg-zinc-800/80 rounded-xl transition">
          <i data-lucide="database" class="w-4 h-4"></i> 시스템 백업
        </a>
      </nav>
    </div>
    <div class="pt-4 border-t border-zinc-800">
      <button onclick="location.href='login.html'" class="w-full flex items-center gap-3 px-4 py-3 text-sm font-semibold text-zinc-400 hover:text-red-500 hover:bg-zinc-800/80 rounded-xl transition">
        <i data-lucide="log-out" class="w-4 h-4"></i> 로그아웃
      </button>
    </div>
  </aside>

  <!-- 메인 영역 -->
  <main class="flex-1 p-8 overflow-y-auto max-w-[1600px] mx-auto w-full">
    <header class="flex flex-col md:flex-row justify-between md:items-center gap-4 mb-8">
      <div>
        <div class="flex items-center gap-3">
          <h2 class="text-2xl font-black text-white tracking-tight">메인 배너 & 프로모션 관리</h2>
          <span id="bannerBadge" class="bg-red-500/10 border border-red-500/30 text-xs text-red-400 px-3 py-1 rounded-full font-bold">활성 0개</span>
        </div>
        <p class="text-xs text-zinc-400 mt-1">메인 홈 상단 슬라이드 배너, 서브 이벤트 배너의 노출 순서, 노출 상태 및 CTR 클릭 통계를 관리합니다.</p>
      </div>
      
      <button id="openBannerModalBtn" class="bg-red-600 hover:bg-red-700 text-white font-bold text-xs px-5 py-3 rounded-xl shadow-lg shadow-red-600/30 transition flex items-center justify-center gap-2 shrink-0">
        <i data-lucide="plus" class="w-4 h-4"></i> 새 배너 등록
      </button>
    </header>

    <!-- KPI 요약 카드 -->
    <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
      <div class="bg-zinc-900/80 border border-zinc-800/80 p-4 rounded-2xl flex items-center justify-between">
        <div>
          <p class="text-xs text-zinc-400 font-medium">전체 배너 수</p>
          <h3 id="statTotalBanners" class="text-xl font-black text-white mt-1">0개</h3>
        </div>
        <div class="w-10 h-10 rounded-xl bg-zinc-800 flex items-center justify-center text-zinc-400"><i data-lucide="image" class="w-5 h-5"></i></div>
      </div>
      <div class="bg-zinc-900/80 border border-zinc-800/80 p-4 rounded-2xl flex items-center justify-between">
        <div>
          <p class="text-xs text-zinc-400 font-medium">현재 노출 중</p>
          <h3 id="statActiveBanners" class="text-xl font-black text-emerald-400 mt-1">0개</h3>
        </div>
        <div class="w-10 h-10 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400"><i data-lucide="check-circle-2" class="w-5 h-5"></i></div>
      </div>
      <div class="bg-zinc-900/80 border border-zinc-800/80 p-4 rounded-2xl flex items-center justify-between">
        <div>
          <p class="text-xs text-zinc-400 font-medium">누적 총 노출수 (Impressions)</p>
          <h3 id="statTotalImp" class="text-xl font-black text-blue-400 mt-1">0</h3>
        </div>
        <div class="w-10 h-10 rounded-xl bg-blue-500/10 border border-blue-500/20 flex items-center justify-center text-blue-400"><i data-lucide="eye" class="w-5 h-5"></i></div>
      </div>
      <div class="bg-zinc-900/80 border border-zinc-800/80 p-4 rounded-2xl flex items-center justify-between">
        <div>
          <p class="text-xs text-zinc-400 font-medium">평균 클릭률 (CTR)</p>
          <h3 id="statAvgCtr" class="text-xl font-black text-amber-400 mt-1">0.0%</h3>
        </div>
        <div class="w-10 h-10 rounded-xl bg-amber-500/10 border border-amber-500/20 flex items-center justify-center text-amber-400"><i data-lucide="mouse-pointer-click" class="w-5 h-5"></i></div>
      </div>
    </section>

    <!-- 배너 카드 그리드 -->
    <div id="bannerGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- JS로 배너 리스트 카드 렌더링 -->
    </div>
  </main>

  <!-- 배너 등록/수정 모달 -->
  <div id="bannerModal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4 z-50">
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl w-full max-w-xl p-6 relative shadow-2xl">
      <div class="flex justify-between items-center pb-4 mb-4 border-b border-zinc-800">
        <h3 id="bannerModalTitle" class="text-lg font-bold text-white flex items-center gap-2">
          <i data-lucide="image" class="w-5 h-5 text-red-500"></i> 새 배너 등록
        </h3>
        <button id="closeBannerModalBtn" class="text-zinc-500 hover:text-white p-1"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>

      <form id="bannerForm" class="space-y-4">
        <input type="hidden" id="bannerId">
        <div>
          <label class="block text-xs text-zinc-400 mb-1 font-medium">배너 제목 / 캠페인명 <span class="text-red-500">*</span></label>
          <input type="text" id="bannerTitleInput" required placeholder="예: [신작] 오징어게임 시즌3 메인 배너" class="w-full bg-zinc-800 border border-zinc-700 text-xs text-white rounded-xl p-3 outline-none focus:border-red-500">
        </div>
        <div>
          <label class="block text-xs text-zinc-400 mb-1 font-medium">이미지 URL <span class="text-red-500">*</span></label>
          <input type="url" id="bannerImageUrlInput" required placeholder="https://images.unsplash.com/..." class="w-full bg-zinc-800 border border-zinc-700 text-xs text-white rounded-xl p-3 outline-none focus:border-red-500">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-zinc-400 mb-1 font-medium">연결 이동 URL (Link)</label>
            <input type="text" id="bannerLinkInput" placeholder="/contents/101" class="w-full bg-zinc-800 border border-zinc-700 text-xs text-white rounded-xl p-3 outline-none focus:border-red-500">
          </div>
          <div>
            <label class="block text-xs text-zinc-400 mb-1 font-medium">노출 순서 (우선순위)</label>
            <input type="number" id="bannerOrderInput" min="1" value="1" class="w-full bg-zinc-800 border border-zinc-700 text-xs text-white rounded-xl p-3 outline-none focus:border-red-500">
          </div>
        </div>
        <div class="flex items-center gap-2 bg-zinc-950 p-3 rounded-xl border border-zinc-800">
          <input type="checkbox" id="bannerActiveInput" class="w-4 h-4 rounded accent-red-600 bg-zinc-800 border-zinc-700" checked>
          <label for="bannerActiveInput" class="text-xs text-zinc-300 font-bold cursor-pointer">🟢 즉시 메인 페이지에 노출 활성화</label>
        </div>
        <div class="flex justify-end gap-2 pt-4 border-t border-zinc-800">
          <button type="button" id="cancelBannerModalBtn" class="px-5 py-2.5 text-xs text-zinc-400 hover:bg-zinc-800 rounded-xl">취소</button>
          <button type="submit" class="px-6 py-2.5 text-xs bg-red-600 hover:bg-red-700 font-bold rounded-xl text-white shadow-lg shadow-red-600/30">저장하기</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="js/banners.js"></script>
</body>
</html>

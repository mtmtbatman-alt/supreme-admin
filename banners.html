<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배너 관리 - Supreme TV</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="dark-mode">
    <div class="admin-wrapper">
        <!-- 사이드바 -->
        <aside class="sidebar">
            <h2>Supreme TV V2</h2>
            <nav>
                <ul>
                    <li><a href="dashboard.html">대시보드</a></li>
                    <li><a href="content.html">콘텐츠 관리</a></li>
                    <li><a href="banners.html" class="active">배너 관리</a></li>
                    <li><a href="notice.html">공지사항</a></li>
                    <li><a href="backup.html">백업 및 복구</a></li>
                    <li><a href="settings.html">관리자 & 로그</a></li>
                </ul>
            </nav>
            <button onclick="logoutAdmin()" class="btn-logout">로그아웃</button>
        </aside>

        <!-- 메인 콘텐츠 영역 -->
        <main class="main-content">
            <h1>배너 관리</h1>

            <div class="section-header">
                <h3>등록된 배너 목록</h3>
                <button class="btn-primary" onclick="openAddBannerModal()">+ 배너 추가</button>
            </div>

            <table class="data-table">
                <thead>
                    <tr>
                        <th>미리보기</th>
                        <th>제목</th>
                        <th>위치</th>
                        <th>작업</th>
                    </tr>
                </thead>
                <tbody id="bannerTableBody">
                    <!-- JS로 데이터 출력 -->
                </tbody>
            </table>
        </main>
    </div>

    <!-- Script Load -->
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/logger.js"></script>
    <script src="js/banners.js"></script>
</body>
</html>

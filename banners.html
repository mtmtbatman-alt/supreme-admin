<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>배너 관리 - SUPREME ADMIN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-zinc-950 text-white min-h-screen flex selection:bg-red-600 selection:text-white">

  <!-- 사이드바 -->
  <aside class="w-64 bg-zinc-900 border-r border-zinc-800 flex flex-col justify-between min-h-screen p-4 shrink-0">
    <div>
      <div class="px-4 py-3 mb-6 flex items-center gap-2">
        <div class="w-3 h-3 rounded-full bg-red-600 animate-pulse"></div>
        <h1 class="text-xl font-black text-red-600 tracking-wider">SUPREME ADMIN</h1>
      </div>
      <nav class="space-y-1">
        <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 text-sm font-semibold text-zinc-400 hover:text-white hover:bg-zinc-800/80 rounded-xl transition">
          <i data-lucide="layout-dashboard" class="w-4 h-4"></i> 대시보드 홈
        </a>
        <a href="content.html" class="flex items-center gap-3 px-4 py-3 text-sm font-semibold text-zinc-400 hover:text-white hover:bg-zinc-800/80 rounded-xl transition">
          <i data-lucide="film" class="w-4 h-4"></i> 콘텐츠 관리
        </a>
        <a href="banners.html" class="flex items-center gap-3 px-4 py-3 text-sm font-semibold text-white bg-red-600 rounded-xl shadow-lg shadow-red-600/20 transition">
          <i data-lucide="image" class="w-4 h-4"></i> 배너 관리
        </a>
        <a href="notice.html" class="flex items-center gap-3 px-4 py-3 text-sm font-semibold text-zinc-400 hover:text-white hover:bg-zinc-800/80 rounded-xl transition">
          <i data-lucide="bell" class="w-4 h-4"></i> 공지사항
        </a>
        <a href="settings.html" class="flex items-center gap-3 px-4 py-3 text-sm font-semibold text-zinc-400 hover:text-white hover:bg-zinc-800/80 rounded-xl transition">
          <i data-lucide="settings" class="w-4 h-4"></i> 설정
        </a>
        <a href="backup.html" class="flex items-center gap-3 px-4 py-3 text-sm font-semibold text-zinc-400 hover:text-white hover:bg-zinc-800/80 rounded-xl transition">
          <i data-lucide="database" class="w-4 h-4"></i> 시스템 백업
        </a>
      </nav>
    </div>
    
    <div class="pt-4 border-t border-zinc-800">
      <button onclick="location.href='login.html'" class="w-full flex items-center gap-3 px-4 py-3 text-sm font-semibold text-zinc-400 hover:text-red-500 hover:bg-zinc-800/80 rounded-xl transition">
        <i data-lucide="log-out" class="w-4 h-4"></i> 로그아웃
      </button>
    </div>
  </aside>

  <!-- 메인 영역 -->
  <main class="flex-1 p-8 overflow-y-auto max-w-[1600px] mx-auto w-full">
    <!-- 헤더 -->
    <header class="flex flex-col md:flex-row justify-between md:items-center gap-4 mb-8">
      <div>
        <div class="flex items-center gap-3">
          <h2 class="text-2xl font-black text-white tracking-tight">프로모션 배너 센터</h2>
          <span id="bannerBadge" class="bg-red-500/10 border border-red-500/30 text-xs text-red-400 px-3 py-1 rounded-full font-bold">활성 0개</span>
        </div>
        <p class="text-xs text-zinc-400 mt-1">홈 히어로 메인, 중간 띠배너, 서브 팝업 등 위치별 배너와 클릭 통계를 한눈에 관리합니다.</p>
      </div>
      
      <button id="openBannerModalBtn" class="bg-red-600 hover:bg-red-700 text-white font-bold text-xs px-5 py-3 rounded-xl shadow-lg shadow-red-600/30 transition flex items-center justify-center gap-2 shrink-0">
        <i data-lucide="plus" class="w-4 h-4"></i> 신규 배너 생성
      </button>
    </header>

    <!-- 필터 및 세그먼트 탭 -->
    <div class="flex flex-col sm:flex-row justify-between items-stretch sm:items-center gap-4 mb-6 bg-zinc-900/60 p-3 rounded-2xl border border-zinc-800/80 backdrop-blur-md">
      <!-- 위치 필터 탭 -->
      <div class="flex gap-1 overflow-x-auto pb-2 sm:pb-0 scrollbar-none" id="positionTabs">
        <button data-position="all" class="px-4 py-2 text-xs font-bold rounded-xl bg-red-600 text-white transition shrink-0">전체 위치</button>
        <button data-position="main_hero" class="px-4 py-2 text-xs font-bold rounded-xl text-zinc-400 hover:text-white hover:bg-zinc-800 transition shrink-0">메인 히어로 (상단)</button>
        <button data-position="middle_banner" class="px-4 py-2 text-xs font-bold rounded-xl text-zinc-400 hover:text-white hover:bg-zinc-800 transition shrink-0">중간 띠배너</button>
        <button data-position="popup" class="px-4 py-2 text-xs font-bold rounded-xl text-zinc-400 hover:text-white hover:bg-zinc-800 transition shrink-0">이벤트 팝업</button>
      </div>

      <!-- 상태 필터 -->
      <div class="flex items-center gap-2 shrink-0">
        <select id="statusFilter" class="bg-zinc-800 border border-zinc-700 text-xs text-zinc-300 rounded-xl px-3 py-2 outline-none focus:border-red-500">
          <option value="all">모든 상태</option>
          <option value="active">노출 중만</option>
          <option value="inactive">숨김만</option>
        </select>
      </div>
    </div>

    <!-- 배너 카드 그리드 레이아웃 -->
    <div id="bannerGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- JS로 완성도 높은 배너 카드가 렌더링됩니다 -->
    </div>
  </main>

  <!-- 배너 등록/수정 모달 -->
  <div id="bannerModal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4 z-50">
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl w-full max-w-lg p-6 relative shadow-2xl my-8 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center pb-4 mb-4 border-b border-zinc-800 sticky top-0 bg-zinc-900 z-10">
        <h3 id="modalTitle" class="text-lg font-bold text-white flex items-center gap-2">
          <i data-lucide="image" class="w-5 h-5 text-red-500"></i> 신규 배너 등록
        </h3>
        <button id="closeBannerModalBtn" class="text-zinc-500 hover:text-white p-1 transition"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>

      <form id="bannerForm" class="space-y-4">
        <input type="hidden" id="bannerId">

        <div>
          <label class="block text-xs text-zinc-400 mb-1 font-medium">배너 제목 / 프로모션명 <span class="text-red-500">*</span></label>
          <input type="text" id="bannerTitleInput" required placeholder="예: [특가] 추석 연휴 독점 신작 몰아보기" class="w-full bg-zinc-800 border border-zinc-700 text-xs text-white rounded-xl p-3 outline-none focus:border-red-500 transition">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-zinc-400 mb-1 font-medium">배너 게시 위치 <span class="text-red-500">*</span></label>
            <select id="bannerPositionInput" required class="w-full bg-zinc-800 border border-zinc-700 text-xs text-white rounded-xl p-3 outline-none focus:border-red-500">
              <option value="main_hero">메인 히어로 (상단 슬라이드)</option>
              <option value="middle_banner">중간 띠배너</option>
              <option value="popup">이벤트 레이어 팝업</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-zinc-400 mb-1 font-medium">노출 순서 (우선순위)</label>
            <input type="number" id="bannerOrderInput" min="1" value="1" class="w-full bg-zinc-800 border border-zinc-700 text-xs text-white rounded-xl p-3 outline-none focus:border-red-500">
          </div>
        </div>

        <div>
          <label class="block text-xs text-zinc-400 mb-1 font-medium">배너 이미지 URL <span class="text-red-500">*</span></label>
          <input type="url" id="bannerImageUrlInput" required placeholder="https://images.unsplash.com/..." class="w-full bg-zinc-800 border border-zinc-700 text-xs text-white rounded-xl p-3 outline-none focus:border-red-500 transition">
        </div>

        <!-- 실시간 이미지 미리보기 영역 -->
        <div>
          <span class="block text-xs text-zinc-400 mb-1 font-medium">실시간 프리뷰</span>
          <div class="relative w-full h-40 bg-zinc-950 border border-zinc-800 rounded-xl overflow-hidden flex items-center justify-center group">
            <img id="bannerImagePreview" src="https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?w=800&auto=format&fit=crop&q=80" class="w-full h-full object-cover transition" alt="배너 미리보기">
            <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent flex items-end p-3">
              <span class="text-[11px] text-zinc-300 font-medium bg-black/60 backdrop-blur-md px-2.5 py-1 rounded-lg border border-white/10">
                실제 노출 형태 시뮬레이션
              </span>
            </div>
          </div>
        </div>

        <div>
          <label class="block text-xs text-zinc-400 mb-1 font-medium">클릭 시 이동할 링크 URL</label>
          <input type="text" id="bannerLinkInput" placeholder="예: https://supreme.com/event/123" class="w-full bg-zinc-800 border border-zinc-700 text-xs text-white rounded-xl p-3 outline-none focus:border-red-500">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-zinc-400 mb-1 font-medium">게시 상태</label>
            <select id="bannerStatusInput" class="w-full bg-zinc-800 border border-zinc-700 text-xs text-white rounded-xl p-3 outline-none focus:border-red-500">
              <option value="active">노출 중 (게시)</option>
              <option value="inactive">숨김 (비활성화)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-zinc-400 mb-1 font-medium">배너 텍스트 색상</label>
            <select id="bannerTextColorInput" class="w-full bg-zinc-800 border border-zinc-700 text-xs text-white rounded-xl p-3 outline-none focus:border-red-500">
              <option value="text-white">밝은 색 (흰색)</option>
              <option value="text-zinc-900">어두운 색 (검은색)</option>
            </select>
          </div>
        </div>

        <div class="flex justify-end gap-2 pt-4 border-t border-zinc-800">
          <button type="button" id="cancelBannerModalBtn" class="px-5 py-2.5 text-xs text-zinc-400 hover:bg-zinc-800 rounded-xl transition">취소</button>
          <button type="submit" class="px-6 py-2.5 text-xs bg-red-600 hover:bg-red-700 font-bold rounded-xl text-white shadow-lg shadow-red-600/30 transition">배너 저장하기</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="js/banners.js"></script>
</body>
</html>

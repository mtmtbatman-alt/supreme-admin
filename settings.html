<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사이트 설정 - Supreme TV Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-black text-white min-h-screen flex">

  <!-- 사이드바 -->
  <aside class="w-64 bg-zinc-900 border-r border-zinc-800 p-6 flex flex-col justify-between hidden md:flex shrink-0">
    <div>
      <div class="flex items-center gap-2 mb-8">
        <span class="text-2xl font-black tracking-wider text-red-600">SUPREME</span>
        <span class="text-xs bg-red-950 text-red-400 px-2 py-0.5 rounded border border-red-800 font-bold">ADMIN</span>
      </div>

      <nav class="space-y-1">
        <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm text-zinc-400 hover:bg-zinc-800 hover:text-white transition">📊 대시보드</a>
        <a href="content.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm text-zinc-400 hover:bg-zinc-800 hover:text-white transition">🎬 콘텐츠 관리</a>
        <a href="banners.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm text-zinc-400 hover:bg-zinc-800 hover:text-white transition">🖼️ 배너 관리</a>
        <a href="notice.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm text-zinc-400 hover:bg-zinc-800 hover:text-white transition">📢 공지사항</a>
        <a href="settings.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm bg-red-600 text-white font-semibold shadow-lg shadow-red-600/20">⚙️ 사이트 설정</a>
        <a href="backup.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm text-zinc-400 hover:bg-zinc-800 hover:text-white transition">💾 데이터 백업</a>
      </nav>
    </div>

    <div class="border-t border-zinc-800 pt-4">
      <div class="text-xs text-zinc-500 mb-2 truncate" id="adminUserEmail">admin@supremetv.com</div>
      <button id="logoutBtn" class="w-full text-left text-xs text-red-400 hover:text-red-300 font-semibold py-1">🚪 로그아웃</button>
    </div>
  </aside>

  <!-- 메인 콘텐츠 영역 -->
  <main class="flex-1 bg-zinc-950 p-8 overflow-y-auto">
    <div class="mb-8">
      <h1 class="text-2xl font-bold text-white">사이트 기본 설정</h1>
      <p class="text-xs text-zinc-400 mt-1">사이트 운영에 필요한 글로벌 메타 설정 및 서버 유지보수 상태를 관리합니다.</p>
    </div>

    <form id="settingsForm" class="max-w-3xl space-y-6">
      
      <!-- 기본 정보 설정 카드 -->
      <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-6 shadow-xl space-y-4">
        <h2 class="text-lg font-bold text-white mb-4 border-b border-zinc-800 pb-3">📌 기본 사이트 정보</h2>
        
        <div>
          <label class="block text-xs font-semibold text-zinc-400 mb-1.5">사이트 이름</label>
          <input 
            type="text" 
            id="siteNameInput" 
            placeholder="SUPREME TV" 
            class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-red-500 transition"
          >
        </div>

        <div>
          <label class="block text-xs font-semibold text-zinc-400 mb-1.5">메인 전광판 / 상단 알림 문구</label>
          <input 
            type="text" 
            id="bannerNoticeInput" 
            placeholder="사이트 이용 중 불편사항은 고객센터로 문의주세요." 
            class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-red-500 transition"
          >
        </div>

        <div>
          <label class="block text-xs font-semibold text-zinc-400 mb-1.5">고객센터 / 문의 이메일</label>
          <input 
            type="email" 
            id="supportEmailInput" 
            placeholder="support@supremetv.com" 
            class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-red-500 transition"
          >
        </div>
      </div>

      <!-- 서비스 점검 설정 카드 -->
      <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-6 shadow-xl space-y-4">
        <h2 class="text-lg font-bold text-white mb-4 border-b border-zinc-800 pb-3">🚨 서비스 유지보수 (점검 모드)</h2>
        
        <div class="flex items-center justify-between py-2">
          <div>
            <div class="font-semibold text-sm text-white">점검 모드 활성화</div>
            <div class="text-xs text-zinc-400">켜면 일반 사용자의 메인 페이지 접근이 차단되고 점검 안내가 표시됩니다.</div>
          </div>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" id="maintenanceModeToggle" class="sr-only peer">
            <div class="w-11 h-6 bg-zinc-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-zinc-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-red-600"></div>
          </label>
        </div>

        <div>
          <label class="block text-xs font-semibold text-zinc-400 mb-1.5">점검 안내 메시지</label>
          <textarea 
            id="maintenanceMsgInput" 
            rows="3" 
            placeholder="현재 시스템 정기 점검 중입니다. 서비스 이용에 불편을 드려 죄송합니다." 
            class="w-full bg-zinc-800 border border-zinc-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-red-500 transition resize-none"
          ></textarea>
        </div>
      </div>

      <!-- 저장 버튼 -->
      <div class="flex justify-end">
        <button 
          type="submit" 
          id="saveSettingsBtn"
          class="bg-red-600 hover:bg-red-700 text-white font-bold px-8 py-3 rounded-xl text-sm transition shadow-lg shadow-red-600/20"
        >
          설정 저장하기
        </button>
      </div>

    </form>
  </main>

  <script type="module" src="js/settings.js"></script>
</body>
</html>

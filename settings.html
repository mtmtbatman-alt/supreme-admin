<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시스템 설정 - SUPREME ADMIN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-zinc-950 text-white min-h-screen flex selection:bg-red-600 selection:text-white">

  <!-- 사이드바 -->
  <aside class="w-64 bg-zinc-900 border-r border-zinc-800 flex flex-col justify-between min-h-screen p-4 shrink-0">
    <div>
      <div class="px-4 py-3 mb-6 flex items-center gap-2">
        <div class="w-3 h-3 rounded-full bg-red-600 animate-pulse"></div>
        <h1 class="text-xl font-black text-red-600 tracking-wider">SUPREME ADMIN</h1>
      </div>
      <nav class="space-y-1">
        <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 text-sm font-semibold text-zinc-400 hover:text-white hover:bg-zinc-800/80 rounded-xl transition">
          <i data-lucide="layout-dashboard" class="w-4 h-4"></i> 대시보드 홈
        </a>
        <a href="content.html" class="flex items-center gap-3 px-4 py-3 text-sm font-semibold text-zinc-400 hover:text-white hover:bg-zinc-800/80 rounded-xl transition">
          <i data-lucide="film" class="w-4 h-4"></i> 콘텐츠 관리
        </a>
        <a href="banners.html" class="flex items-center gap-3 px-4 py-3 text-sm font-semibold text-zinc-400 hover:text-white hover:bg-zinc-800/80 rounded-xl transition">
          <i data-lucide="image" class="w-4 h-4"></i> 배너 관리
        </a>
        <a href="notice.html" class="flex items-center gap-3 px-4 py-3 text-sm font-semibold text-zinc-400 hover:text-white hover:bg-zinc-800/80 rounded-xl transition">
          <i data-lucide="bell" class="w-4 h-4"></i> 공지사항
        </a>
        <a href="settings.html" class="flex items-center gap-3 px-4 py-3 text-sm font-semibold text-white bg-red-600 rounded-xl shadow-lg shadow-red-600/20 transition">
          <i data-lucide="settings" class="w-4 h-4"></i> 설정
        </a>
        <a href="backup.html" class="flex items-center gap-3 px-4 py-3 text-sm font-semibold text-zinc-400 hover:text-white hover:bg-zinc-800/80 rounded-xl transition">
          <i data-lucide="database" class="w-4 h-4"></i> 시스템 백업
        </a>
      </nav>
    </div>
    <div class="pt-4 border-t border-zinc-800">
      <button onclick="location.href='login.html'" class="w-full flex items-center gap-3 px-4 py-3 text-sm font-semibold text-zinc-400 hover:text-red-500 hover:bg-zinc-800/80 rounded-xl transition">
        <i data-lucide="log-out" class="w-4 h-4"></i> 로그아웃
      </button>
    </div>
  </aside>

  <!-- 메인 영역 -->
  <main class="flex-1 p-8 overflow-y-auto max-w-[1200px] mx-auto w-full">
    <header class="mb-8">
      <h2 class="text-2xl font-black text-white tracking-tight">시스템 환경 설정</h2>
      <p class="text-xs text-zinc-400 mt-1">관리자 보안, 플랫폼 기본 스트리밍 및 알림 정책을 설정합니다.</p>
    </header>

    <div class="space-y-6">
      <!-- 1. 프로필 & 보안 설정 -->
      <section class="bg-zinc-900 border border-zinc-800 rounded-2xl p-6">
        <h3 class="text-base font-bold text-white flex items-center gap-2 mb-4">
          <i data-lucide="shield-check" class="w-5 h-5 text-red-500"></i> 관리자 보안 및 계정 설정
        </h3>
        <form id="profileForm" class="space-y-4">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs text-zinc-400 mb-1 font-medium">관리자 계정 이메일</label>
              <input type="email" id="adminEmail" value="admin@supreme.com" class="w-full bg-zinc-800 border border-zinc-700 text-xs text-white rounded-xl p-3 outline-none focus:border-red-500">
            </div>
            <div>
              <label class="block text-xs text-zinc-400 mb-1 font-medium">관리자 닉네임</label>
              <input type="text" id="adminName" value="최고관리자 (Master)" class="w-full bg-zinc-800 border border-zinc-700 text-xs text-white rounded-xl p-3 outline-none focus:border-red-500">
            </div>
          </div>
          <div class="pt-2">
            <button type="submit" class="bg-red-600 hover:bg-red-700 text-white font-bold text-xs px-5 py-2.5 rounded-xl shadow-lg shadow-red-600/30 transition">
              계정 정보 업데이트
            </button>
          </div>
        </form>
      </section>

      <!-- 2. 스트리밍 & 플레이어 기본 설정 -->
      <section class="bg-zinc-900 border border-zinc-800 rounded-2xl p-6">
        <h3 class="text-base font-bold text-white flex items-center gap-2 mb-4">
          <i data-lucide="sliders" class="w-5 h-5 text-red-500"></i> OTT 플레이어 정책 설정
        </h3>
        <form id="playerSettingsForm" class="space-y-4">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs text-zinc-400 mb-1 font-medium">기본 스트리밍 품질</label>
              <select id="defaultQuality" class="w-full bg-zinc-800 border border-zinc-700 text-xs text-white rounded-xl p-3 outline-none focus:border-red-500">
                <option value="4K">4K Ultra HD (HDR)</option>
                <option value="FHD" selected>1080p Full HD</option>
                <option value="HD">720p HD</option>
              </select>
            </div>
            <div>
              <label class="block text-xs text-zinc-400 mb-1 font-medium">DRM 보안 레벨</label>
              <select id="drmLevel" class="w-full bg-zinc-800 border border-zinc-700 text-xs text-white rounded-xl p-3 outline-none focus:border-red-500">
                <option value="widevine_l1" selected>Widevine L1 (최고 수준 보안)</option>
                <option value="widevine_l3">Widevine L3 (일반 표준)</option>
              </select>
            </div>
          </div>

          <div class="space-y-3 pt-2">
            <div class="flex items-center justify-between p-3 bg-zinc-950 rounded-xl border border-zinc-800">
              <div>
                <p class="text-xs font-bold text-white">다음 에피소드 자동 재생</p>
                <p class="text-[11px] text-zinc-500">시청 완료 5초 전 다음 화를 자동으로 연결합니다.</p>
              </div>
              <input type="checkbox" id="autoPlayNext" checked class="w-4 h-4 rounded accent-red-600 bg-zinc-800 border-zinc-700 cursor-pointer">
            </div>

            <div class="flex items-center justify-between p-3 bg-zinc-950 rounded-xl border border-zinc-800">
              <div>
                <p class="text-xs font-bold text-white">오프라인 다운로드 허용</p>
                <p class="text-[11px] text-zinc-500">모바일 앱 사용자에게 저장 기능을 제공합니다.</p>
              </div>
              <input type="checkbox" id="allowOffline" checked class="w-4 h-4 rounded accent-red-600 bg-zinc-800 border-zinc-700 cursor-pointer">
            </div>
          </div>

          <div class="pt-2">
            <button type="submit" class="bg-zinc-800 hover:bg-zinc-700 text-white font-bold text-xs px-5 py-2.5 rounded-xl border border-zinc-700 transition">
              플레이어 설정 저장
            </button>
          </div>
        </form>
      </section>
    </div>
  </main>

  <script type="module" src="js/settings.js"></script>
</body>
</html>

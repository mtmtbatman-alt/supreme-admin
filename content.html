<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>콘텐츠 관리 - SUPREME ADMIN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
  <!-- Lucide 아이콘 CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-zinc-950 text-white min-h-screen flex selection:bg-red-600 selection:text-white">

  <!-- 사이드바 -->
  <aside class="w-64 bg-zinc-900 border-r border-zinc-800 flex flex-col justify-between min-h-screen p-4 shrink-0">
    <div>
      <div class="px-4 py-3 mb-6 flex items-center gap-2">
        <div class="w-3 h-3 rounded-full bg-red-600 animate-pulse"></div>
        <h1 class="text-xl font-black text-red-600 tracking-wider">SUPREME ADMIN</h1>
      </div>
      <nav class="space-y-1">
        <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 text-sm font-semibold text-zinc-400 hover:text-white hover:bg-zinc-800/80 rounded-xl transition">
          <i data-lucide="layout-dashboard" class="w-4 h-4"></i> 대시보드 홈
        </a>
        <a href="content.html" class="flex items-center gap-3 px-4 py-3 text-sm font-semibold text-white bg-red-600 rounded-xl shadow-lg shadow-red-600/20 transition">
          <i data-lucide="film" class="w-4 h-4"></i> 콘텐츠 관리
        </a>
        <a href="banners.html" class="flex items-center gap-3 px-4 py-3 text-sm font-semibold text-zinc-400 hover:text-white hover:bg-zinc-800/80 rounded-xl transition">
          <i data-lucide="image" class="w-4 h-4"></i> 배너 관리
        </a>
        <a href="notice.html" class="flex items-center gap-3 px-4 py-3 text-sm font-semibold text-zinc-400 hover:text-white hover:bg-zinc-800/80 rounded-xl transition">
          <i data-lucide="bell" class="w-4 h-4"></i> 공지사항
        </a>
        <a href="settings.html" class="flex items-center gap-3 px-4 py-3 text-sm font-semibold text-zinc-400 hover:text-white hover:bg-zinc-800/80 rounded-xl transition">
          <i data-lucide="settings" class="w-4 h-4"></i> 설정
        </a>
        <a href="backup.html" class="flex items-center gap-3 px-4 py-3 text-sm font-semibold text-zinc-400 hover:text-white hover:bg-zinc-800/80 rounded-xl transition">
          <i data-lucide="database" class="w-4 h-4"></i> 시스템 백업
        </a>
      </nav>
    </div>
    
    <div class="pt-4 border-t border-zinc-800">
      <button onclick="location.href='login.html'" class="w-full flex items-center gap-3 px-4 py-3 text-sm font-semibold text-zinc-400 hover:text-red-500 hover:bg-zinc-800/80 rounded-xl transition">
        <i data-lucide="log-out" class="w-4 h-4"></i> 로그아웃
      </button>
    </div>
  </aside>

  <!-- 메인 영역 -->
  <main class="flex-1 p-8 overflow-y-auto max-w-[1600px] mx-auto w-full">
    <!-- 헤더 -->
    <header class="flex justify-between items-center mb-8">
      <div>
        <div class="flex items-center gap-3">
          <h2 class="text-2xl font-black text-white tracking-tight">콘텐츠 라이브러리 관리</h2>
          <span id="totalBadge" class="bg-zinc-800 border border-zinc-700 text-xs text-zinc-300 px-2.5 py-1 rounded-full font-bold">전체 0개</span>
        </div>
        <p class="text-xs text-zinc-400 mt-1">등록된 VOD/미디어 콘텐츠의 상세 정보, 관람등급, 공개 상태를 관리합니다.</p>
      </div>
      <div class="flex gap-3">
        <button id="deleteSelectedBtn" class="hidden bg-zinc-800 hover:bg-red-950/80 text-red-400 border border-red-900/50 font-bold text-xs px-4 py-2.5 rounded-xl transition items-center gap-2">
          <i data-lucide="trash-2" class="w-4 h-4"></i> 선택 항목 삭제 (<span id="selectedCount">0</span>)
        </button>
        <button id="openModalBtn" class="bg-red-600 hover:bg-red-700 text-white font-bold text-xs px-5 py-2.5 rounded-xl shadow-lg shadow-red-600/30 transition flex items-center gap-2">
          <i data-lucide="plus" class="w-4 h-4"></i> 신규 콘텐츠 등록
        </button>
      </div>
    </header>

    <!-- 요약 미니 통계 칩 -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
      <div class="bg-zinc-900/80 border border-zinc-800/80 p-4 rounded-2xl flex items-center justify-between">
        <div>
          <p class="text-[11px] text-zinc-400 font-medium">공개중 콘텐츠</p>
          <h4 id="activeCount" class="text-xl font-bold text-emerald-400 mt-0.5">0</h4>
        </div>
        <div class="w-10 h-10 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400">
          <i data-lucide="eye" class="w-5 h-5"></i>
        </div>
      </div>
      <div class="bg-zinc-900/80 border border-zinc-800/80 p-4 rounded-2xl flex items-center justify-between">
        <div>
          <p class="text-[11px] text-zinc-400 font-medium">비공개 콘텐츠</p>
          <h4 id="inactiveCount" class="text-xl font-bold text-zinc-400 mt-0.5">0</h4>
        </div>
        <div class="w-10 h-10 rounded-xl bg-zinc-800 border border-zinc-700 flex items-center justify-center text-zinc-400">
          <i data-lucide="eye-off" class="w-5 h-5"></i>
        </div>
      </div>
      <div class="bg-zinc-900/80 border border-zinc-800/80 p-4 rounded-2xl flex items-center justify-between">
        <div>
          <p class="text-[11px] text-zinc-400 font-medium">총 누적 조회수</p>
          <h4 id="totalViewsSum" class="text-xl font-bold text-white mt-0.5">0</h4>
        </div>
        <div class="w-10 h-10 rounded-xl bg-red-500/10 border border-red-500/20 flex items-center justify-center text-red-500">
          <i data-lucide="play-circle" class="w-5 h-5"></i>
        </div>
      </div>
      <div class="bg-zinc-900/80 border border-zinc-800/80 p-4 rounded-2xl flex items-center justify-between">
        <div>
          <p class="text-[11px] text-zinc-400 font-medium">평균 평점</p>
          <h4 id="avgRating" class="text-xl font-bold text-amber-400 mt-0.5">★ 4.8</h4>
        </div>
        <div class="w-10 h-10 rounded-xl bg-amber-500/10 border border-amber-500/20 flex items-center justify-center text-amber-400">
          <i data-lucide="star" class="w-5 h-5"></i>
        </div>
      </div>
    </div>

    <!-- 검색 & 필터 컨트롤 바 -->
    <div class="bg-zinc-900/90 border border-zinc-800 p-4 rounded-2xl mb-6 flex flex-col lg:flex-row gap-4 justify-between items-center backdrop-blur-md">
      <div class="flex flex-wrap items-center gap-3 w-full lg:w-auto">
        <!-- 카테고리 필터 -->
        <select id="categoryFilter" class="bg-zinc-800 border border-zinc-700 text-xs text-zinc-200 rounded-xl px-3.5 py-2.5 outline-none focus:border-red-500 cursor-pointer">
          <option value="all">🎬 전체 장르 / 카테고리</option>
          <option value="영화">영화 (Movie)</option>
          <option value="드라마">드라마 (Drama)</option>
          <option value="예능">예능 (Show)</option>
          <option value="애니">애니메이션 (Anime)</option>
        </select>

        <!-- 상태 필터 -->
        <select id="statusFilter" class="bg-zinc-800 border border-zinc-700 text-xs text-zinc-200 rounded-xl px-3.5 py-2.5 outline-none focus:border-red-500 cursor-pointer">
          <option value="all">📌 전체 공개 상태</option>
          <option value="active">공개 (Active)</option>
          <option value="inactive">비공개 (Hidden)</option>
        </select>

        <!-- 정렬 방식 -->
        <select id="sortFilter" class="bg-zinc-800 border border-zinc-700 text-xs text-zinc-200 rounded-xl px-3.5 py-2.5 outline-none focus:border-red-500 cursor-pointer">
          <option value="latest">최신 등록순</option>
          <option value="views">조회수 많은순</option>
          <option value="rating">평점 높은순</option>
          <option value="title">제목 가나다순</option>
        </select>
      </div>

      <!-- 검색창 -->
      <div class="relative w-full lg:w-80">
        <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-3 text-zinc-500"></i>
        <input type="text" id="searchInput" placeholder="콘텐츠 제목 또는 배우/감독 검색..." class="w-full bg-zinc-800/80 border border-zinc-700 text-xs text-white placeholder-zinc-500 rounded-xl pl-10 pr-4 py-2.5 outline-none focus:border-red-500 transition">
      </div>
    </div>

    <!-- 콘텐츠 테이블 -->
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden shadow-2xl">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b border-zinc-800 bg-zinc-900/80 text-[11px] text-zinc-400 uppercase tracking-wider">
              <th class="py-4 px-4 w-10 text-center">
                <input type="checkbox" id="selectAllCheckbox" class="rounded bg-zinc-800 border-zinc-700 text-red-600 focus:ring-0 cursor-pointer">
              </th>
              <th class="py-4 px-4 font-semibold">콘텐츠 정보</th>
              <th class="py-4 px-4 font-semibold">장르 / 관람등급</th>
              <th class="py-4 px-4 font-semibold">상태</th>
              <th class="py-4 px-4 font-semibold">조회수 / 평점</th>
              <th class="py-4 px-4 font-semibold">등록일시</th>
              <th class="py-4 px-4 font-semibold text-right">관리</th>
            </tr>
          </thead>
          <tbody id="contentTableBody" class="divide-y divide-zinc-800/60 text-xs">
            <!-- JS로 고퀄리티 렌더링 -->
          </tbody>
        </table>
      </div>

      <!-- 하단 페이지네이션 바 -->
      <div class="px-6 py-4 border-t border-zinc-800 flex justify-between items-center text-xs text-zinc-400 bg-zinc-900/50">
        <span>총 <strong id="showingCount" class="text-white">0</strong>개 중 1-10개 표시 중</span>
        <div class="flex gap-1" id="pagination">
          <button class="px-3 py-1.5 rounded-lg bg-zinc-800 border border-zinc-700 hover:bg-zinc-700 text-white font-medium disabled:opacity-50" disabled>이전</button>
          <button class="px-3 py-1.5 rounded-lg bg-red-600 text-white font-bold">1</button>
          <button class="px-3 py-1.5 rounded-lg bg-zinc-800 border border-zinc-700 hover:bg-zinc-700 text-white font-medium">다음</button>
        </div>
      </div>
    </div>
  </main>

  <!-- 모달 창 (신규 / 수정) -->
  <div id="contentModal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4 z-50 transition-all">
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl w-full max-w-xl p-6 relative shadow-2xl overflow-y-auto max-h-[90vh]">
      <div class="flex justify-between items-center pb-4 mb-4 border-b border-zinc-800">
        <h3 id="modalTitle" class="text-lg font-bold text-white flex items-center gap-2">
          <i data-lucide="film" class="w-5 h-5 text-red-500"></i> 신규 콘텐츠 등록
        </h3>
        <button id="closeModalBtn" class="text-zinc-500 hover:text-white p-1 transition"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      
      <form id="contentForm" class="space-y-4">
        <input type="hidden" id="contentId">
        
        <!-- 제목 & 포스터 URL -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div class="md:col-span-2 space-y-3">
            <div>
              <label class="block text-xs text-zinc-400 mb-1 font-medium">콘텐츠 제목 <span class="text-red-500">*</span></label>
              <input type="text" id="titleInput" required placeholder="예: 오징어 게임 시즌2" class="w-full bg-zinc-800 border border-zinc-700 text-xs text-white rounded-xl p-3 outline-none focus:border-red-500 transition">
            </div>
            <div>
              <label class="block text-xs text-zinc-400 mb-1 font-medium">포스터 이미지 URL</label>
              <input type="url" id="posterInput" placeholder="https://images.unsplash.com/..." class="w-full bg-zinc-800 border border-zinc-700 text-xs text-white rounded-xl p-3 outline-none focus:border-red-500 transition">
            </div>
          </div>
          <div class="flex flex-col items-center justify-center border-2 border-dashed border-zinc-800 rounded-xl p-2 bg-zinc-950/50">
            <img id="posterPreview" src="https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=300&auto=format&fit=crop&q=80" class="w-24 h-32 object-cover rounded-lg shadow" alt="포스터 미리가보기">
            <span class="text-[10px] text-zinc-500 mt-1">포스터 미리보기</span>
          </div>
        </div>

        <!-- 카테고리 / 관람등급 / 상태 -->
        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="block text-xs text-zinc-400 mb-1 font-medium">장르 / 카테고리</label>
            <select id="categoryInput" class="w-full bg-zinc-800 border border-zinc-700 text-xs text-white rounded-xl p-3 outline-none focus:border-red-500">
              <option value="드라마">드라마</option>
              <option value="영화">영화</option>
              <option value="예능">예능</option>
              <option value="애니">애니</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-zinc-400 mb-1 font-medium">관람 등급</label>
            <select id="ratingAgeInput" class="w-full bg-zinc-800 border border-zinc-700 text-xs text-white rounded-xl p-3 outline-none focus:border-red-500">
              <option value="ALL">전체관람가</option>
              <option value="12">12세 이상</option>
              <option value="15">15세 이상</option>
              <option value="19">19세 이상 (청불)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-zinc-400 mb-1 font-medium">공개 상태</label>
            <select id="statusInput" class="w-full bg-zinc-800 border border-zinc-700 text-xs text-white rounded-xl p-3 outline-none focus:border-red-500">
              <option value="active">공개</option>
              <option value="inactive">비공개</option>
            </select>
          </div>
        </div>

        <!-- 러닝타임 / 출연진 -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-zinc-400 mb-1 font-medium">러닝타임 / 회차</label>
            <input type="text" id="durationInput" placeholder="예: 120분 또는 8부작" class="w-full bg-zinc-800 border border-zinc-700 text-xs text-white rounded-xl p-3 outline-none focus:border-red-500">
          </div>
          <div>
            <label class="block text-xs text-zinc-400 mb-1 font-medium">주연 배우 / 감독</label>
            <input type="text" id="castInput" placeholder="예: 이정재, 박해수" class="w-full bg-zinc-800 border border-zinc-700 text-xs text-white rounded-xl p-3 outline-none focus:border-red-500">
          </div>
        </div>

        <div>
          <label class="block text-xs text-zinc-400 mb-1 font-medium">줄거리 / 요약</label>
          <textarea id="descInput" rows="3" placeholder="콘텐츠에 대한 시놉시스를 입력하세요." class="w-full bg-zinc-800 border border-zinc-700 text-xs text-white rounded-xl p-3 outline-none focus:border-red-500 resize-none"></textarea>
        </div>

        <div class="flex justify-end gap-2 pt-3 border-t border-zinc-800">
          <button type="button" id="cancelModalBtn" class="px-5 py-2.5 text-xs text-zinc-400 hover:bg-zinc-800 rounded-xl transition">취소</button>
          <button type="submit" class="px-6 py-2.5 text-xs bg-red-600 hover:bg-red-700 font-bold rounded-xl text-white shadow-lg shadow-red-600/30 transition">저장하기</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="js/content.js"></script>
</body>
</html>

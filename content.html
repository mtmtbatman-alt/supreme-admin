<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>콘텐츠 관리 - Supreme TV Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-black text-white min-h-screen flex">

  <!-- 사이드바 -->
  <aside class="w-64 bg-zinc-900 border-r border-zinc-800 p-6 flex flex-col justify-between hidden md:flex shrink-0">
    <div>
      <div class="flex items-center gap-2 mb-8">
        <span class="text-2xl font-black tracking-wider text-red-600">SUPREME</span>
        <span class="text-xs bg-red-950 text-red-400 px-2 py-0.5 rounded border border-red-800 font-bold">ADMIN</span>
      </div>

      <nav class="space-y-1">
        <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm text-zinc-400 hover:bg-zinc-800 hover:text-white transition">📊 대시보드</a>
        <a href="content.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm bg-red-600 text-white font-semibold shadow-lg shadow-red-600/20">🎬 콘텐츠 관리</a>
        <a href="banners.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm text-zinc-400 hover:bg-zinc-800 hover:text-white transition">🖼️ 배너 관리</a>
        <a href="notice.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm text-zinc-400 hover:bg-zinc-800 hover:text-white transition">📢 공지사항</a>
        <a href="settings.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm text-zinc-400 hover:bg-zinc-800 hover:text-white transition">⚙️ 사이트 설정</a>
        <a href="backup.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm text-zinc-400 hover:bg-zinc-800 hover:text-white transition">💾 데이터 백업</a>
      </nav>
    </div>

    <div class="border-t border-zinc-800 pt-4">
      <div class="text-xs text-zinc-500 mb-2 truncate" id="adminUserEmail">admin@supremetv.com</div>
      <button id="logoutBtn" class="w-full text-left text-xs text-red-400 hover:text-red-300 font-semibold py-1">🚪 로그아웃</button>
    </div>
  </aside>

  <!-- 메인 콘텐츠 영역 -->
  <main class="flex-1 bg-zinc-950 p-8 overflow-y-auto">
    <div class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-2xl font-bold text-white">콘텐츠 관리</h1>
        <p class="text-xs text-zinc-400 mt-1">VOD 콘텐츠 검색, 등록, 추천 및 상태 관리를 진행합니다.</p>
      </div>
      <button id="openModalBtn" class="bg-red-600 hover:bg-red-700 text-white font-semibold px-4 py-2.5 rounded-xl text-sm transition shadow-lg shadow-red-600/20">
        + 신규 콘텐츠 등록
      </button>
    </div>

    <!-- 검색/필터/정렬 바 (검색버튼 추가됨) -->
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 mb-6 flex flex-wrap gap-3 items-center justify-between">
      <div class="flex flex-wrap gap-2 items-center flex-1">
        <!-- 검색어 입력 -->
        <input 
          type="text" 
          id="searchInput" 
          placeholder="제목 검색..." 
          class="bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-red-500 w-full sm:w-52"
        >
        <!-- 🔍 명확한 검색 버튼 -->
        <button id="searchBtn" class="bg-zinc-800 hover:bg-zinc-700 text-white font-semibold px-4 py-2 rounded-xl text-sm border border-zinc-700 transition">
          검색
        </button>

        <!-- 🔄 검색 초기화 버튼 -->
        <button id="resetSearchBtn" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-400 hover:text-white px-3 py-2 rounded-xl text-sm border border-zinc-700 transition">
          초기화
        </button>

        <!-- 카테고리 필터 -->
        <select id="categoryFilter" class="bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-red-500">
          <option value="">전체 카테고리</option>
          <option value="영화">영화</option>
          <option value="드라마">드라마</option>
          <option value="예능">예능</option>
          <option value="애니">애니</option>
        </select>

        <!-- 정렬 -->
        <select id="sortFilter" class="bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-red-500">
          <option value="created_at_desc">최신순</option>
          <option value="created_at_asc">오래된순</option>
          <option value="title_asc">제목 오름차순</option>
        </select>
      </div>

      <button id="deleteSelectedBtn" class="bg-zinc-800 hover:bg-red-950 text-red-400 border border-zinc-700 hover:border-red-800 text-xs font-semibold px-4 py-2.5 rounded-xl transition">
        선택 삭제
      </button>
    </div>

    <!-- 콘텐츠 테이블 -->
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden mb-6 shadow-xl">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-zinc-300">
          <thead class="bg-zinc-800/60 text-xs text-zinc-400 uppercase tracking-wider">
            <tr>
              <th class="p-4 w-10"><input type="checkbox" id="selectAllCheckbox" class="rounded bg-zinc-800 border-zinc-700"></th>
              <th class="p-4">콘텐츠 정보</th>
              <th class="p-4">카테고리</th>
              <th class="p-4">공개 여부</th>
              <th class="p-4">추천 지정</th>
              <th class="p-4">등록일</th>
              <th class="p-4 text-right">관리</th>
            </tr>
          </thead>
          <tbody id="contentTableBody" class="divide-y divide-zinc-800/60">
            <tr>
              <td colspan="7" class="p-8 text-center text-zinc-500">데이터를 불러오는 중...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 페이지네이션 -->
    <div class="flex items-center justify-between text-sm text-zinc-400">
      <span id="paginationInfo">총 0개 중 0-0</span>
      <div class="flex gap-1.5" id="paginationBtns"></div>
    </div>
  </main>

  <!-- 등록/수정 모달 -->
  <div id="contentModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl w-full max-w-lg p-6 shadow-2xl">
      <h2 id="modalTitle" class="text-xl font-bold text-white mb-4">신규 콘텐츠 등록</h2>
      
      <form id="contentForm" class="space-y-4">
        <input type="hidden" id="contentId">
        
        <div>
          <label class="block text-xs font-semibold text-zinc-400 mb-1.5">제목 *</label>
          <input type="text" id="titleInput" required placeholder="예: 해를 품은 달" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-red-500">
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-zinc-400 mb-1.5">카테고리</label>
            <select id="categorySelect" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-red-500">
              <option value="영화">영화</option>
              <option value="드라마">드라마</option>
              <option value="예능">예능</option>
              <option value="애니">애니</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-zinc-400 mb-1.5">포스터 이미지 URL</label>
            <input type="url" id="posterInput" placeholder="https://..." class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-red-500">
          </div>
        </div>

        <div class="flex items-center gap-6 pt-2">
          <label class="flex items-center gap-2 text-xs text-zinc-300 cursor-pointer">
            <input type="checkbox" id="isPublicInput" checked class="rounded bg-zinc-800 border-zinc-700 text-red-600 focus:ring-0">
            공개 처리
          </label>
          <label class="flex items-center gap-2 text-xs text-zinc-300 cursor-pointer">
            <input type="checkbox" id="isFeaturedInput" class="rounded bg-zinc-800 border-zinc-700 text-red-600 focus:ring-0">
            메인 추천 콘텐츠 지정
          </label>
        </div>

        <div class="flex gap-3 justify-end pt-4 border-t border-zinc-800">
          <button type="button" id="closeModalBtn" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-sm px-4 py-2 rounded-xl transition">취소</button>
          <button type="submit" class="bg-red-600 hover:bg-red-700 text-white font-semibold text-sm px-5 py-2 rounded-xl transition shadow-lg shadow-red-600/20">저장</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="js/content.js"></script>
</body>
</html>

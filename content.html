<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>콘텐츠 관리 - SUPREME ADMIN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-zinc-950 text-white min-h-screen flex">

  <!-- 사이드바 -->
  <aside class="w-64 bg-zinc-900 border-r border-zinc-800 flex flex-col justify-between min-h-screen p-4">
    <div>
      <div class="px-4 py-3 mb-6">
        <h1 class="text-xl font-black text-red-600 tracking-wider">SUPREME ADMIN</h1>
      </div>
      <nav class="space-y-1">
        <a href="dashboard.html" class="flex items-center px-4 py-3 text-sm font-semibold text-zinc-400 hover:text-white hover:bg-zinc-800 rounded-xl transition">
          대시보드 홈
        </a>
        <a href="content.html" class="flex items-center px-4 py-3 text-sm font-semibold text-white bg-red-600 rounded-xl transition">
          콘텐츠 관리
        </a>
        <a href="banners.html" class="flex items-center px-4 py-3 text-sm font-semibold text-zinc-400 hover:text-white hover:bg-zinc-800 rounded-xl transition">
          배너 관리
        </a>
        <a href="notice.html" class="flex items-center px-4 py-3 text-sm font-semibold text-zinc-400 hover:text-white hover:bg-zinc-800 rounded-xl transition">
          공지사항
        </a>
        <a href="settings.html" class="flex items-center px-4 py-3 text-sm font-semibold text-zinc-400 hover:text-white hover:bg-zinc-800 rounded-xl transition">
          설정
        </a>
        <a href="backup.html" class="flex items-center px-4 py-3 text-sm font-semibold text-zinc-400 hover:text-white hover:bg-zinc-800 rounded-xl transition">
          시스템 백업
        </a>
      </nav>
    </div>
    
    <div class="pt-4 border-t border-zinc-800">
      <button onclick="location.href='login.html'" class="w-full text-left px-4 py-3 text-sm font-semibold text-zinc-400 hover:text-red-500 hover:bg-zinc-800 rounded-xl transition">
        로그아웃
      </button>
    </div>
  </aside>

  <!-- 메인 영역 -->
  <main class="flex-1 p-8 overflow-y-auto">
    <!-- 헤더 -->
    <header class="flex justify-between items-center mb-8">
      <div>
        <h2 class="text-2xl font-bold">콘텐츠 관리</h2>
        <p class="text-xs text-zinc-400 mt-1">등록된 콘텐츠를 조회하고 관리합니다.</p>
      </div>
      <button id="openModalBtn" class="bg-red-600 hover:bg-red-700 text-white font-bold text-xs px-4 py-2.5 rounded-xl transition flex items-center gap-2">
        <span>+ 신규 콘텐츠 등록</span>
      </button>
    </header>

    <!-- 검색 & 필터 바 -->
    <div class="bg-zinc-900 border border-zinc-800 p-4 rounded-2xl mb-6 flex flex-col md:flex-row gap-4 justify-between items-center">
      <div class="flex items-center gap-3 w-full md:w-auto">
        <select id="categoryFilter" class="bg-zinc-800 border border-zinc-700 text-xs text-zinc-200 rounded-xl px-3 py-2.5 outline-none focus:border-red-500">
          <option value="all">전체 카테고리</option>
          <option value="영화">영화</option>
          <option value="드라마">드라마</option>
          <option value="예능">예능</option>
          <option value="애니">애니</option>
        </select>

        <select id="statusFilter" class="bg-zinc-800 border border-zinc-700 text-xs text-zinc-200 rounded-xl px-3 py-2.5 outline-none focus:border-red-500">
          <option value="all">전체 상태</option>
          <option value="active">공개</option>
          <option value="inactive">비공개</option>
        </select>
      </div>

      <div class="w-full md:w-80">
        <input type="text" id="searchInput" placeholder="콘텐츠 제목으로 검색..." class="w-full bg-zinc-800 border border-zinc-700 text-xs text-white placeholder-zinc-500 rounded-xl px-4 py-2.5 outline-none focus:border-red-500 transition">
      </div>
    </div>

    <!-- 콘텐츠 테이블 -->
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b border-zinc-800 bg-zinc-900/50 text-xs text-zinc-400">
              <th class="py-3.5 px-5 font-medium">제목</th>
              <th class="py-3.5 px-5 font-medium">카테고리</th>
              <th class="py-3.5 px-5 font-medium">상태</th>
              <th class="py-3.5 px-5 font-medium">등록일시</th>
              <th class="py-3.5 px-5 font-medium text-right">관리</th>
            </tr>
          </thead>
          <tbody id="contentTableBody" class="divide-y divide-zinc-800/60 text-xs">
            <!-- 자바스크립트로 로딩됨 -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- 신규/수정 모달 창 -->
  <div id="contentModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl w-full max-w-md p-6 relative shadow-2xl">
      <h3 id="modalTitle" class="text-lg font-bold mb-4 text-white">신규 콘텐츠 등록</h3>
      
      <form id="contentForm" class="space-y-4">
        <input type="hidden" id="contentId">
        
        <div>
          <label class="block text-xs text-zinc-400 mb-1 font-medium">콘텐츠 제목</label>
          <input type="text" id="titleInput" required placeholder="예: 오징어 게임 시즌2" class="w-full bg-zinc-800 border border-zinc-700 text-xs text-white rounded-xl p-3 outline-none focus:border-red-500">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-zinc-400 mb-1 font-medium">카테고리</label>
            <select id="categoryInput" class="w-full bg-zinc-800 border border-zinc-700 text-xs text-white rounded-xl p-3 outline-none focus:border-red-500">
              <option value="드라마">드라마</option>
              <option value="영화">영화</option>
              <option value="예능">예능</option>
              <option value="애니">애니</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-zinc-400 mb-1 font-medium">공개 상태</label>
            <select id="statusInput" class="w-full bg-zinc-800 border border-zinc-700 text-xs text-white rounded-xl p-3 outline-none focus:border-red-500">
              <option value="active">공개</option>
              <option value="inactive">비공개</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs text-zinc-400 mb-1 font-medium">설명 / 요약</label>
          <textarea id="descInput" rows="3" placeholder="콘텐츠에 대한 간단한 설명을 입력하세요." class="w-full bg-zinc-800 border border-zinc-700 text-xs text-white rounded-xl p-3 outline-none focus:border-red-500 resize-none"></textarea>
        </div>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" id="closeModalBtn" class="px-4 py-2.5 text-xs text-zinc-400 hover:bg-zinc-800 rounded-xl transition">취소</button>
          <button type="submit" class="px-5 py-2.5 text-xs bg-red-600 hover:bg-red-700 font-bold rounded-xl text-white transition">저장하기</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="js/content.js"></script>
</body>
</html>

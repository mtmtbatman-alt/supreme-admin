<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>슈프림 어드민 - 콘텐츠 관리</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#0b0b0b] text-white min-h-screen flex m-0">

    <!-- 사이드바 (원본 100% 유지) -->
    <aside class="w-64 bg-[#141416] border-r border-[#222226] p-6 flex flex-col justify-between">
        <div>
            <div class="flex items-center gap-3 mb-10">
                <span class="w-2.5 h-2.5 rounded-full bg-red-600"></span>
                <h1 class="text-red-600 font-bold text-lg tracking-wider">SUPREME ADMIN</h1>
            </div>
            <nav class="space-y-2 text-sm text-gray-400">
                <a href="dashboard.html" class="flex items-center px-4 py-3 rounded-xl hover:text-white hover:bg-[#1e1e24] transition-colors">
                    대시보드 홈
                </a>
                <a href="content.html" class="flex items-center px-4 py-3 rounded-xl text-white bg-gradient-to-r from-red-600 to-red-700 shadow-lg shadow-red-900/30 font-medium">
                    콘텐츠 관리
                </a>
                <a href="banners.html" class="flex items-center px-4 py-3 rounded-xl hover:text-white hover:bg-[#1e1e24] transition-colors">
                    배너 관리
                </a>
                <a href="notice.html" class="flex items-center px-4 py-3 rounded-xl hover:text-white hover:bg-[#1e1e24] transition-colors">
                    공지사항
                </a>
                <a href="settings.html" class="flex items-center px-4 py-3 rounded-xl hover:text-white hover:bg-[#1e1e24] transition-colors">
                    설정
                </a>
                <a href="backup.html" class="flex items-center px-4 py-3 rounded-xl hover:text-white hover:bg-[#1e1e24] transition-colors">
                    시스템 백업
                </a>
            </nav>
        </div>
        <div class="pt-4 border-t border-[#222226]">
            <button id="logoutBtn" class="w-full text-left px-4 py-3 rounded-xl text-sm text-gray-400 hover:text-red-500 hover:bg-red-500/10 transition-colors">
                로그아웃
            </button>
        </div>
    </aside>

    <!-- 메인 컨텐츠 영역 -->
    <main class="flex-1 p-10 overflow-y-auto">
        <header class="mb-8 flex justify-between items-center">
            <div>
                <h2 class="text-2xl font-bold">콘텐츠 관리 센터</h2>
                <p class="text-xs text-gray-500 mt-1">플랫폼 스트리밍 콘텐츠, 카테고리,공개 상태 및 순서를 관리합니다.</p>
            </div>
            <button onclick="openContentModal()" class="bg-red-600 hover:bg-red-700 text-white px-5 py-2.5 rounded-xl text-sm font-medium transition-colors shadow-lg shadow-red-900/30 flex items-center gap-2">
                <i data-lucide="plus" class="w-4 h-4"></i> 신규 콘텐츠 등록
            </button>
        </header>

        <!-- 검색, 필터 및 다중 제어 바 -->
        <section class="bg-[#141416] p-4 rounded-xl border border-[#222226] mb-6 flex flex-wrap gap-4 items-center justify-between">
            <div class="flex items-center gap-3">
                <select class="bg-[#0b0b0b] border border-[#222226] text-gray-300 text-xs rounded-lg px-3 py-2.5 outline-none focus:border-red-600">
                    <option>전체 카테고리</option>
                    <option>오리지널 시리즈</option>
                    <option>영화</option>
                    <option>다큐멘터리</option>
                </select>
                <select class="bg-[#0b0b0b] border border-[#222226] text-gray-300 text-xs rounded-lg px-3 py-2.5 outline-none focus:border-red-600">
                    <option>전체 상태 (공개/비공개)</option>
                    <option>공개</option>
                    <option>비공개</option>
                </select>
                <button onclick="batchDelete()" class="bg-red-500/10 hover:bg-red-500/20 text-red-500 text-xs px-3 py-2.5 rounded-lg border border-red-500/20 transition-colors">
                    선택 다중 삭제
                </button>
            </div>
            <div class="w-72">
                <input type="text" placeholder="콘텐츠 제목 검색..." class="w-full bg-[#0b0b0b] border border-[#222226] text-gray-300 text-xs rounded-lg px-4 py-2.5 outline-none focus:border-red-600">
            </div>
        </section>

        <!-- 콘텐츠 목록 테이블 -->
        <section class="bg-[#141416] rounded-xl border border-[#222226] overflow-hidden">
            <table class="w-full text-left border-collapse text-sm">
                <thead>
                    <tr class="border-b border-[#222226] text-gray-400 bg-[#1a1a1e] text-xs">
                        <th class="p-4 w-12 text-center"><input type="checkbox"></th>
                        <th class="p-4 w-16 text-center">포스터</th>
                        <th class="p-4">콘텐츠 제목</th>
                        <th class="p-4 w-32">카테고리</th>
                        <th class="p-4 w-24 text-center">추천 여부</th>
                        <th class="p-4 w-28 text-center">상태</th>
                        <th class="p-4 w-28 text-center">관리</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-[#222226] text-gray-300 text-xs">
                    <tr>
                        <td class="p-4 text-center"><input type="checkbox"></td>
                        <td class="p-4 text-center"><div class="w-10 h-12 bg-gray-800 rounded mx-auto flex items-center justify-center text-[10px] text-gray-500">IMG</div></td>
                        <td class="p-4 font-medium text-white">사이버펑크: 에지러너스 시즌 2</td>
                        <td class="p-4 text-gray-400">오리지널 시리즈</td>
                        <td class="p-4 text-center"><span class="text-amber-500 font-semibold">★ 추천</span></td>
                        <td class="p-4 text-center"><span class="text-green-500 font-medium">● 공개</span></td>
                        <td class="p-4 text-center">
                            <button class="text-gray-400 hover:text-white mr-2">수정</button>
                            <button class="text-red-500 hover:text-red-400">삭제</button>
                        </td>
                    </tr>
                </tbody>
            </table>
            <!-- 페이지네이션 (20개 단위 기준) -->
            <div class="p-4 border-t border-[#222226] flex justify-between items-center text-xs text-gray-400">
                <span>총 1개 콘텐츠 (페이지 1 / 1)</span>
                <div class="flex gap-1">
                    <button class="px-3 py-1.5 bg-[#1a1a1e] rounded border border-[#222226] text-gray-300">이전</button>
                    <button class="px-3 py-1.5 bg-red-600 rounded text-white font-medium">1</button>
                    <button class="px-3 py-1.5 bg-[#1a1a1e] rounded border border-[#222226] text-gray-300">다음</button>
                </div>
            </div>
        </section>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const adminUser = JSON.parse(sessionStorage.getItem('sp_admin_user'));
            if (!adminUser) { window.location.href = 'login.html'; return; }
            document.getElementById('logoutBtn').addEventListener('click', () => {
                sessionStorage.removeItem('sp_admin_user');
                window.location.href = 'login.html';
            });
            if (window.lucide) { window.lucide.createIcons(); }
        });
        function openContentModal() { alert('신규 콘텐츠 등록 모달 오픈'); }
        function batchDelete() { alert('선택한 콘텐츠들을 다중 삭제합니다.'); }
    </script>
</body>
</html>

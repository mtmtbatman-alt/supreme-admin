<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>슈프림 어드민 대시보드</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b0b0b] text-white min-h-screen flex m-0">

    <!-- 사이드바 -->
    <aside class="w-64 bg-[#141416] border-r border-[#222226] p-6 flex flex-col justify-between">
        <div>
            <h1 class="text-red-600 font-bold text-lg mb-10 tracking-wider">● SUPREME ADMIN</h1>
            <nav class="space-y-4 text-sm text-gray-400">
                <a href="dashboard.html" class="block text-white font-medium">대시보드</a>
                <a href="#" class="block hover:text-white transition-colors">사용자 관리</a>
                <a href="#" class="block hover:text-white transition-colors">통계 분석</a>
            </nav>
        </div>
        <div>
            <button id="logoutBtn" class="w-full text-left text-sm text-red-500 hover:text-red-400 transition-colors">
                로그아웃
            </button>
        </div>
    </aside>

    <!-- 메인 컨텐츠 영역 -->
    <main class="flex-1 p-10 overflow-y-auto">
        <header class="mb-8">
            <h2 class="text-2xl font-bold" id="welcomeMsg">대시보드에 오신 것을 환영합니다.</h2>
            <p class="text-xs text-gray-500 mt-1">시스템 상태 및 관리자 세션 정보</p>
        </header>

        <!-- 통계 카드 그리드 -->
        <section class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-[#141416] p-6 rounded-xl border border-[#222226]">
                <p class="text-gray-400 text-xs mb-1">접속 계정 이메일</p>
                <p class="text-lg font-bold text-white truncate" id="userEmail">로딩중...</p>
            </div>
            <div class="bg-[#141416] p-6 rounded-xl border border-[#222226]">
                <p class="text-gray-400 text-xs mb-1">권한 등급</p>
                <p class="text-lg font-bold text-red-500" id="userRole">SUPER_ADMIN</p>
            </div>
            <div class="bg-[#141416] p-6 rounded-xl border border-[#222226]">
                <p class="text-gray-400 text-xs mb-1">시스템 상태</p>
                <p class="text-lg font-bold text-green-500">안정 (Online)</p>
            </div>
        </section>
    </main>

    <!-- 대시보드 스크립트 연결 -->
    <script src="js/dashboard.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>대시보드 홈 - SUPREME ADMIN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-zinc-950 text-white min-h-screen flex">

  <!-- 사이드바 -->
  <aside class="w-64 bg-zinc-900 border-r border-zinc-800 flex flex-col justify-between min-h-screen p-4">
    <div>
      <div class="px-4 py-3 mb-6">
        <h1 class="text-xl font-black text-red-600 tracking-wider">SUPREME ADMIN</h1>
      </div>
      <nav class="space-y-1">
        <a href="dashboard.html" class="flex items-center px-4 py-3 text-sm font-semibold text-white bg-red-600 rounded-xl transition">
          대시보드 홈
        </a>
        <a href="content.html" class="flex items-center px-4 py-3 text-sm font-semibold text-zinc-400 hover:text-white hover:bg-zinc-800 rounded-xl transition">
          콘텐츠 관리
        </a>
        <a href="banners.html" class="flex items-center px-4 py-3 text-sm font-semibold text-zinc-400 hover:text-white hover:bg-zinc-800 rounded-xl transition">
          배너 관리
        </a>
        <a href="notice.html" class="flex items-center px-4 py-3 text-sm font-semibold text-zinc-400 hover:text-white hover:bg-zinc-800 rounded-xl transition">
          공지사항
        </a>
        <a href="settings.html" class="flex items-center px-4 py-3 text-sm font-semibold text-zinc-400 hover:text-white hover:bg-zinc-800 rounded-xl transition">
          설정
        </a>
        <a href="backup.html" class="flex items-center px-4 py-3 text-sm font-semibold text-zinc-400 hover:text-white hover:bg-zinc-800 rounded-xl transition">
          시스템 백업
        </a>
      </nav>
    </div>
    
    <div class="pt-4 border-t border-zinc-800">
      <button id="logoutBtn" onclick="location.href='login.html'" class="w-full text-left px-4 py-3 text-sm font-semibold text-zinc-400 hover:text-red-500 hover:bg-zinc-800 rounded-xl transition">
        로그아웃
      </button>
    </div>
  </aside>

  <!-- 메인 콘텐츠 영역 -->
  <main class="flex-1 p-8 overflow-y-auto">
    <!-- 헤더 -->
    <header class="flex justify-between items-center mb-8">
      <div>
        <h2 class="text-2xl font-bold">대시보드 홈</h2>
        <p class="text-xs text-zinc-400 mt-1">시스템 현황 및 통계 데이터입니다.</p>
      </div>
      <div class="flex items-center gap-3">
        <span class="text-xs text-zinc-400">최고 관리자님</span>
        <div class="w-8 h-8 rounded-full bg-red-600 flex items-center justify-center font-bold text-xs">A</div>
      </div>
    </header>

    <!-- 카드 현황 통계 -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
      <div class="bg-zinc-900 border border-zinc-800 p-5 rounded-2xl">
        <p class="text-xs text-zinc-400 font-semibold mb-1">총 콘텐츠 수</p>
        <h3 id="totalContent" class="text-2xl font-black text-white">128</h3>
      </div>
      <div class="bg-zinc-900 border border-zinc-800 p-5 rounded-2xl">
        <p class="text-xs text-zinc-400 font-semibold mb-1">활성 배너</p>
        <h3 id="activeBanners" class="text-2xl font-black text-red-500">5</h3>
      </div>
      <div class="bg-zinc-900 border border-zinc-800 p-5 rounded-2xl">
        <p class="text-xs text-zinc-400 font-semibold mb-1">등록된 공지사항</p>
        <h3 id="activeNotices" class="text-2xl font-black text-white">12</h3>
      </div>
      <div class="bg-zinc-900 border border-zinc-800 p-5 rounded-2xl">
        <p class="text-xs text-zinc-400 font-semibold mb-1">누적 조회수</p>
        <h3 id="totalViews" class="text-2xl font-black text-white">45,210</h3>
      </div>
    </div>

    <!-- 차트 & 활동 로그 -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      <!-- 방문자 트렌드 그래프 (SVG 기반 무조건 보임 처리) -->
      <div class="lg:col-span-2 bg-zinc-900 border border-zinc-800 p-6 rounded-2xl flex flex-col justify-between">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-sm font-bold text-zinc-200">주간 방문 트렌드</h3>
          <span class="text-xs text-red-500 font-bold bg-red-500/10 px-2.5 py-1 rounded-full">+18.5% 증가</span>
        </div>
        
        <div class="h-56 w-full relative pt-4">
          <!-- 배경 격자선 -->
          <div class="absolute inset-0 flex flex-col justify-between pointer-events-none opacity-10">
            <div class="border-b border-white w-full"></div>
            <div class="border-b border-white w-full"></div>
            <div class="border-b border-white w-full"></div>
            <div class="border-b border-white w-full"></div>
          </div>

          <!-- SVG 그래디언트 라인 차트 -->
          <svg class="w-full h-full overflow-visible" viewBox="0 0 500 150" preserveAspectRatio="none">
            <defs>
              <linearGradient id="chartGradient" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#ef4444" stop-opacity="0.4" />
                <stop offset="100%" stop-color="#ef4444" stop-opacity="0.0" />
              </linearGradient>
            </defs>

            <!-- 면적 (채우기) -->
            <polygon points="0,150 0,110 83,85 166,95 250,55 333,40 416,25 500,10 500,150" fill="url(#chartGradient)" />

            <!-- 라인 -->
            <polyline points="0,110 83,85 166,95 250,55 333,40 416,25 500,10" fill="none" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

            <!-- 포인트 점들 -->
            <circle cx="0" cy="110" r="4" fill="#ef4444" />
            <circle cx="83" cy="85" r="4" fill="#ef4444" />
            <circle cx="166" cy="95" r="4" fill="#ef4444" />
            <circle cx="250" cy="55" r="4" fill="#ef4444" />
            <circle cx="333" cy="40" r="4" fill="#ef4444" />
            <circle cx="416" cy="25" r="4" fill="#ef4444" />
            <circle cx="500" cy="10" r="5" fill="#ffffff" stroke="#ef4444" stroke-width="3" />
          </svg>
        </div>

        <!-- X축 요일 표시 -->
        <div class="flex justify-between text-xs text-zinc-500 mt-4 px-1">
          <span>월</span>
          <span>화</span>
          <span>수</span>
          <span>목</span>
          <span>금</span>
          <span>토</span>
          <span>일</span>
        </div>
      </div>

      <!-- 최근 관리자 활동 로그 -->
      <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-2xl">
        <h3 class="text-sm font-bold text-zinc-200 mb-4">최근 활동 로그</h3>
        <div class="overflow-x-auto">
          <table class="w-full text-left">
            <tbody id="recentLogsTable">
              <tr class="border-b border-zinc-800 hover:bg-zinc-800/50 transition">
                <td class="py-3 px-4 text-xs text-zinc-400">2026-08-14 15:30</td>
                <td class="py-3 px-4 text-xs font-semibold text-white">최고관리자</td>
                <td class="py-3 px-4 text-xs text-zinc-300">신규 배너 등록 ("메인 프로모션")</td>
              </tr>
              <tr class="border-b border-zinc-800 hover:bg-zinc-800/50 transition">
                <td class="py-3 px-4 text-xs text-zinc-400">2026-08-14 14:12</td>
                <td class="py-3 px-4 text-xs font-semibold text-white">최고관리자</td>
                <td class="py-3 px-4 text-xs text-zinc-300">공지사항 수정 ("점검 안내")</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="js/dashboard.js"></script>
</body>
</html>

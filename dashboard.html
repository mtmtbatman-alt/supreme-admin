<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>슈프림 어드민 대시보드</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-[#0b0b0b] text-white min-h-screen flex m-0">

    <!-- 사이드바 (설정 페이지 등과 완전히 동일한 원본 구조) -->
    <aside class="w-64 bg-[#141416] border-r border-[#222226] p-6 flex flex-col justify-between">
        <div>
            <!-- 로고 영역 -->
            <div class="flex items-center gap-3 mb-10">
                <span class="w-2.5 h-2.5 rounded-full bg-red-600"></span>
                <h1 class="text-red-600 font-bold text-lg tracking-wider">SUPREME ADMIN</h1>
            </div>

            <!-- 네비게이션 메뉴 (대시보드 홈 활성화) -->
            <nav class="space-y-2 text-sm text-gray-400">
                <a href="dashboard.html" class="flex items-center px-4 py-3 rounded-xl text-white bg-gradient-to-r from-red-600 to-red-700 shadow-lg shadow-red-900/30 font-medium">
                    대시보드 홈
                </a>
                <a href="content.html" class="flex items-center px-4 py-3 rounded-xl hover:text-white hover:bg-[#1e1e24] transition-colors">
                    콘텐츠 관리
                </a>
                <a href="banners.html" class="flex items-center px-4 py-3 rounded-xl hover:text-white hover:bg-[#1e1e24] transition-colors">
                    배너 관리
                </a>
                <a href="notice.html" class="flex items-center px-4 py-3 rounded-xl hover:text-white hover:bg-[#1e1e24] transition-colors">
                    공지사항
                </a>
                <a href="settings.html" class="flex items-center px-4 py-3 rounded-xl hover:text-white hover:bg-[#1e1e24] transition-colors">
                    설정
                </a>
                <a href="backup.html" class="flex items-center px-4 py-3 rounded-xl hover:text-white hover:bg-[#1e1e24] transition-colors">
                    시스템 백업
                </a>
            </nav>
        </div>

        <!-- 하단 로그아웃 -->
        <div class="pt-4 border-t border-[#222226]">
            <button id="logoutBtn" class="w-full text-left px-4 py-3 rounded-xl text-sm text-gray-400 hover:text-red-500 hover:bg-red-500/10 transition-colors">
                로그아웃
            </button>
        </div>
    </aside>

    <!-- 메인 컨텐츠 영역 -->
    <main class="flex-1 p-10 overflow-y-auto">
        <header class="mb-8 flex justify-between items-center">
            <div>
                <h2 class="text-2xl font-bold" id="welcomeMsg">최고관리자님, 환영합니다!</h2>
                <p class="text-xs text-gray-500 mt-1">실시간 시스템 트래픽 및 접속 현황</p>
            </div>
            <div class="bg-[#141416] border border-[#222226] px-4 py-2 rounded-lg text-xs text-gray-400 flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                <span id="userEmail">연결 확인 중...</span>
            </div>
        </header>

        <!-- 통계 차트 영역 -->
        <section class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- 트래픽 선 그래프 -->
            <div class="lg:col-span-2 bg-[#141416] p-6 rounded-xl border border-[#222226]">
                <h3 class="text-sm font-semibold text-gray-300 mb-4">주간 동시 시청자 트래픽</h3>
                <div class="h-64">
                    <canvas id="trafficChart"></canvas>
                </div>
            </div>

            <!-- 기기별 접속 비율 도넛 그래프 -->
            <div class="bg-[#141416] p-6 rounded-xl border border-[#222226]">
                <h3 class="text-sm font-semibold text-gray-300 mb-4">기기별 접속 비율</h3>
                <div class="h-64">
                    <canvas id="deviceChart"></canvas>
                </div>
            </div>
        </section>
    </main>

    <!-- 기존 자바스크립트 연결 -->
    <script src="js/dashboard.js"></script>
</body>
</html>

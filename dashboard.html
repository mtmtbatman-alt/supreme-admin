<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SUPREME ADMIN - 대시보드</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="admin-container">
    <aside class="sidebar">
      <div class="logo">
        <h2>SUPREME <span>ADMIN</span></h2>
      </div>
      <nav class="nav-menu">
        <a href="dashboard.html" class="nav-item active">📊 대시보드</a>
        <a href="content.html" class="nav-item">🎬 콘텐츠 관리</a>
        <a href="banners.html" class="nav-item">🖼️ 배너 관리</a>
        <a href="notice.html" class="nav-item">📢 공지사항</a>
        <a href="admin-users.html" class="nav-item">👤 관리자 계정</a>
        <a href="logs.html" class="nav-item">📜 관리자 로그</a>
        <a href="settings.html" class="nav-item">⚙️ 사이트 설정</a>
        <a href="backup.html" class="nav-item">💾 데이터 백업</a>
      </nav>
      <div class="sidebar-footer">
        <span class="user-email" id="adminEmailDisplay">admin@supremetv.com</span>
        <button id="logoutBtn" onclick="handleLogout()" class="btn-logout-link">🚪 로그아웃</button>
      </div>
    </aside>

    <main class="main-content">
      <header class="top-header">
        <h1>대시보드</h1>
        <p class="subtitle">실시간 서비스 방문 통계 및 주요 현황을 모니터링합니다.</p>
      </header>

      <div class="content-body">
        <!-- 📈 통계 카드 섹션 -->
        <div class="stats-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 25px;">
          <div class="card stat-card">
            <h4>오늘 방문자</h4>
            <p id="statToday" class="stat-value">0</p>
          </div>
          <div class="card stat-card">
            <h4>어제 방문자</h4>
            <p id="statYesterday" class="stat-value">0</p>
          </div>
          <div class="card stat-card">
            <h4>총 방문자</h4>
            <p id="statTotalVisits" class="stat-value">0</p>
          </div>
          <div class="card stat-card">
            <h4>현재 접속자</h4>
            <p id="statActiveUsers" class="stat-value" style="color: #e50914;">0</p>
          </div>
          <div class="card stat-card">
            <h4>총 콘텐츠 수</h4>
            <p id="statTotalContents" class="stat-value">0</p>
          </div>
          <div class="card stat-card">
            <h4>총 카테고리 수</h4>
            <p id="statTotalCategories" class="stat-value">0</p>
          </div>
        </div>

        <!-- 📊 차트 섹션 -->
        <div class="card" style="margin-bottom: 25px;">
          <h3>📉 일별 방문자 추이 (최근 7일)</h3>
          <div style="position: relative; height: 300px; width: 100%; margin-top: 15px;">
            <canvas id="visitChart"></canvas>
          </div>
        </div>

        <!-- 📋 최근 활동/콘텐츠 테이블 2열 배치 -->
        <div class="grid-2col" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
          <div class="card">
            <h3>🎬 최근 등록 콘텐츠</h3>
            <table class="data-table" style="margin-top: 10px;">
              <thead>
                <tr>
                  <th>제목</th>
                  <th>등록일</th>
                </tr>
              </thead>
              <tbody id="recentContentsBody">
                <!-- JS 동적 생성 -->
              </tbody>
            </table>
          </div>

          <div class="card">
            <h3>📜 최근 관리자 활동</h3>
            <table class="data-table" style="margin-top: 10px;">
              <thead>
                <tr>
                  <th>관리자</th>
                  <th>작업</th>
                  <th>시간</th>
                </tr>
              </thead>
              <tbody id="recentLogsBody">
                <!-- JS 동적 생성 -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>

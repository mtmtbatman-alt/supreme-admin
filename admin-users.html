<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SUPREME ADMIN - 관리자 계정 관리</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="admin-container">
    <aside class="sidebar">
      <div class="logo">
        <h2>SUPREME <span>ADMIN</span></h2>
      </div>
      <nav class="nav-menu">
        <a href="dashboard.html" class="nav-item">📊 대시보드</a>
        <a href="content.html" class="nav-item">🎬 콘텐츠 관리</a>
        <a href="banners.html" class="nav-item">🖼️ 배너 관리</a>
        <a href="notice.html" class="nav-item">📢 공지사항</a>
        <a href="admin-users.html" class="nav-item active">👤 관리자 계정</a>
        <a href="logs.html" class="nav-item">📜 관리자 로그</a>
        <a href="settings.html" class="nav-item">⚙️ 사이트 설정</a>
        <a href="backup.html" class="nav-item">💾 데이터 백업</a>
      </nav>
      <div class="sidebar-footer">
        <span class="user-email">admin@supremetv.com</span>
        <button id="logoutBtn" onclick="handleLogout()" class="btn-logout-link">🚪 로그아웃</button>
      </div>
    </aside>

    <main class="main-content">
      <header class="top-header">
        <h1>관리자 계정 관리</h1>
        <p class="subtitle">시스템 관리자 계정 추가, 권한 설정 및 보안 현황을 관리합니다.</p>
      </header>

      <div class="content-body">
        <div class="card">
          <div class="card-header-flex" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h3>👤 등록된 관리자 목록</h3>
            <button id="btnAddAdmin" class="btn btn-primary">+ 계정 추가</button>
          </div>

          <table class="data-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>관리자명</th>
                <th>이메일</th>
                <th>권한 레벨</th>
                <th>마지막 로그인</th>
                <th>실패 횟수</th>
                <th>관리</th>
              </tr>
            </thead>
            <tbody id="adminUserTableBody">
              <!-- JS 동적 렌더링 영역 -->
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin-users.js"></script>
</body>
</html>

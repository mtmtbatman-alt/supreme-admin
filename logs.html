<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SUPREME ADMIN - 관리자 로그</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="admin-container">
    <aside class="sidebar">
      <div class="logo">
        <h2>SUPREME <span>ADMIN</span></h2>
      </div>
      <nav class="nav-menu">
        <a href="dashboard.html" class="nav-item">📊 대시보드</a>
        <a href="content.html" class="nav-item">🎬 콘텐츠 관리</a>
        <a href="banners.html" class="nav-item">🖼️ 배너 관리</a>
        <a href="notice.html" class="nav-item">📢 공지사항</a>
        <a href="admin-users.html" class="nav-item">👤 관리자 계정</a>
        <a href="logs.html" class="nav-item active">📜 관리자 로그</a>
        <a href="settings.html" class="nav-item">⚙️ 사이트 설정</a>
        <a href="backup.html" class="nav-item">💾 데이터 백업</a>
      </nav>
      <div class="sidebar-footer">
        <span class="user-email">admin@supremetv.com</span>
        <button id="logoutBtn" onclick="handleLogout()" class="btn-logout-link">🚪 로그아웃</button>
      </div>
    </aside>

    <main class="main-content">
      <header class="top-header">
        <h1>관리자 활동 로그</h1>
        <p class="subtitle">관리자들의 시스템 접속 및 데이터 변경 활동 이력을 모니터링합니다.</p>
      </header>

      <div class="content-body">
        <div class="card">
          <h3>📜 최근 활동 로그</h3>
          <table class="data-table" style="margin-top: 15px;">
            <thead>
              <tr>
                <th>시간</th>
                <th>관리자명</th>
                <th>작업 내용</th>
                <th>IP 주소</th>
              </tr>
            </thead>
            <tbody id="logTableBody">
              <!-- JS 동적 렌더링 영역 -->
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/logs.js"></script>
</body>
</html>

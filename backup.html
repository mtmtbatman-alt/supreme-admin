<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시스템 백업 - SUPREME ADMIN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-zinc-950 text-white min-h-screen flex selection:bg-red-600 selection:text-white">

  <!-- 사이드바 -->
  <aside class="w-64 bg-zinc-900 border-r border-zinc-800 flex flex-col justify-between min-h-screen p-4 shrink-0">
    <div>
      <div class="px-4 py-3 mb-6 flex items-center gap-2">
        <div class="w-3 h-3 rounded-full bg-red-600 animate-pulse"></div>
        <h1 class="text-xl font-black text-red-600 tracking-wider">SUPREME ADMIN</h1>
      </div>
      <nav class="space-y-1">
        <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 text-sm font-semibold text-zinc-400 hover:text-white hover:bg-zinc-800/80 rounded-xl transition">
          <i data-lucide="layout-dashboard" class="w-4 h-4"></i> 대시보드 홈
        </a>
        <a href="content.html" class="flex items-center gap-3 px-4 py-3 text-sm font-semibold text-zinc-400 hover:text-white hover:bg-zinc-800/80 rounded-xl transition">
          <i data-lucide="film" class="w-4 h-4"></i> 콘텐츠 관리
        </a>
        <a href="banners.html" class="flex items-center gap-3 px-4 py-3 text-sm font-semibold text-zinc-400 hover:text-white hover:bg-zinc-800/80 rounded-xl transition">
          <i data-lucide="image" class="w-4 h-4"></i> 배너 관리
        </a>
        <a href="notice.html" class="flex items-center gap-3 px-4 py-3 text-sm font-semibold text-zinc-400 hover:text-white hover:bg-zinc-800/80 rounded-xl transition">
          <i data-lucide="bell" class="w-4 h-4"></i> 공지사항
        </a>
        <a href="settings.html" class="flex items-center gap-3 px-4 py-3 text-sm font-semibold text-zinc-400 hover:text-white hover:bg-zinc-800/80 rounded-xl transition">
          <i data-lucide="settings" class="w-4 h-4"></i> 설정
        </a>
        <a href="backup.html" class="flex items-center gap-3 px-4 py-3 text-sm font-semibold text-white bg-red-600 rounded-xl shadow-lg shadow-red-600/20 transition">
          <i data-lucide="database" class="w-4 h-4"></i> 시스템 백업
        </a>
      </nav>
    </div>
    <div class="pt-4 border-t border-zinc-800">
      <button onclick="location.href='login.html'" class="w-full flex items-center gap-3 px-4 py-3 text-sm font-semibold text-zinc-400 hover:text-red-500 hover:bg-zinc-800/80 rounded-xl transition">
        <i data-lucide="log-out" class="w-4 h-4"></i> 로그아웃
      </button>
    </div>
  </aside>

  <!-- 메인 영역 -->
  <main class="flex-1 p-8 overflow-y-auto max-w-[1400px] mx-auto w-full">
    <header class="flex flex-col md:flex-row justify-between md:items-center gap-4 mb-8">
      <div>
        <div class="flex items-center gap-3">
          <h2 class="text-2xl font-black text-white tracking-tight">데이터베이스 백업 & 복원</h2>
          <span class="bg-emerald-500/10 border border-emerald-500/30 text-xs text-emerald-400 px-3 py-1 rounded-full font-bold">자동 백업 활성</span>
        </div>
        <p class="text-xs text-zinc-400 mt-1">시스템 스냅샷 생성, 수동 JSON/CSV 덤프 내보내기 및 데이터베이스 복구 이력을 관리합니다.</p>
      </div>

      <button id="createBackupBtn" class="bg-red-600 hover:bg-red-700 text-white font-bold text-xs px-5 py-3 rounded-xl shadow-lg shadow-red-600/30 transition flex items-center justify-center gap-2 shrink-0">
        <i data-lucide="hard-drive-download" class="w-4 h-4"></i> 수동 백업 생성
      </button>
    </header>

    <!-- 카드 요약 -->
    <section class="grid grid-cols-1 sm:grid-cols-3 gap-5 mb-8">
      <div class="bg-zinc-900 border border-zinc-800 p-5 rounded-2xl">
        <span class="text-xs text-zinc-400 font-medium">최근 스냅샷 일시</span>
        <h3 id="lastBackupTime" class="text-lg font-black text-white mt-1">2026-08-14 03:00:00</h3>
        <p class="text-[11px] text-emerald-400 font-bold mt-2">● 자동 정기 백업 성공</p>
      </div>

      <div class="bg-zinc-900 border border-zinc-800 p-5 rounded-2xl">
        <span class="text-xs text-zinc-400 font-medium">총 스냅샷 용량</span>
        <h3 id="totalBackupSize" class="text-lg font-black text-white mt-1">1.42 GB</h3>
        <p class="text-[11px] text-zinc-400 mt-2">총 5개 버전 보유 중</p>
      </div>

      <div class="bg-zinc-900 border border-zinc-800 p-5 rounded-2xl">
        <span class="text-xs text-zinc-400 font-medium">자동 백업 주기</span>
        <h3 class="text-lg font-black text-white mt-1">매일 03:00 (KST)</h3>
        <p class="text-[11px] text-zinc-400 mt-2">보관 주기: 30일</p>
      </div>
    </section>

    <!-- 백업 목록 테이블 -->
    <section class="bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden">
      <div class="p-5 border-b border-zinc-800 flex justify-between items-center">
        <h3 class="text-sm font-bold text-white flex items-center gap-2">
          <i data-lucide="history" class="w-4 h-4 text-red-500"></i> 백업 스냅샷 이력
        </h3>
        <button id="refreshBackupBtn" class="text-xs text-zinc-400 hover:text-white flex items-center gap-1">
          <i data-lucide="rotate-cw" class="w-3.5 h-3.5"></i> 새로고침
        </button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs text-zinc-300">
          <thead class="bg-zinc-950/60 text-zinc-400 uppercase font-semibold border-b border-zinc-800">
            <tr>
              <th class="p-4">백업명 / ID</th>
              <th class="p-4">유형</th>
              <th class="p-4">용량</th>
              <th class="p-4">생성 일시</th>
              <th class="p-4">상태</th>
              <th class="p-4 text-right">작업</th>
            </tr>
          </thead>
          <tbody id="backupTableBody" class="divide-y divide-zinc-800/60">
            <!-- JS 렌더링 -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script type="module" src="js/backup.js"></script>
</body>
</html>
